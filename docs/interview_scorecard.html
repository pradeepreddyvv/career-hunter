<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User's Interview Readiness Scorecard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e2a;--bg4:#252a3a;--accent:#6366f1;--accent2:#818cf8;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--cyan:#06b6d4;--pink:#ec4899;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--border:#1e293b;--radius:10px}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
.app{max-width:1400px;margin:0 auto;padding:20px 24px;margin-left:42px}

/* Header */
.header{text-align:center;padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.header p{color:var(--text2);font-size:13px}

/* Overall Score */
.overall{display:flex;align-items:center;justify-content:center;gap:40px;padding:32px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;margin-bottom:24px}
.big-score{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:42px;font-weight:800;position:relative}
.big-score::before{content:'';position:absolute;inset:-4px;border-radius:50%;padding:4px;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor}
.big-score .label{font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.overall-breakdown{display:flex;flex-direction:column;gap:10px;flex:1;max-width:500px}
.ob-row{display:flex;align-items:center;gap:12px}
.ob-label{width:140px;font-size:13px;color:var(--text2)}
.ob-bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.ob-fill{height:100%;border-radius:4px;transition:width .8s}
.ob-val{width:40px;font-size:13px;font-weight:600;text-align:right}

/* Section */
.section{margin-bottom:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-header h2{font-size:18px;font-weight:700}
.section-header .badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}

/* Cards Grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:.2s}
.card:hover{border-color:var(--accent)}.card{position:relative}
/* Edit Infrastructure */
.edit-icon{position:absolute;top:8px;right:8px;opacity:0;transition:.2s;cursor:pointer;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--accent2);z-index:10}
.card:hover .edit-icon,.decision:hover .edit-icon,.gap-item:hover .edit-icon,.q-block:hover .edit-icon,.company-card:hover .edit-icon{opacity:.8}
.edit-icon:hover{opacity:1;background:var(--accent);color:#fff}
.edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.edit-overlay.open{display:flex}
.edit-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:700px;max-height:85vh;overflow-y:auto}
.edit-box h3{font-size:16px;margin-bottom:16px;color:var(--accent2)}
.edit-field{margin-bottom:12px}
.edit-field label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.edit-field input,.edit-field textarea,.edit-field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit}
.edit-field textarea{min-height:60px;resize:vertical}
.edit-field input[type=number]{width:80px}
.edit-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.edit-actions button{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600}
.edit-save{background:var(--accent);color:#fff}.edit-save:hover{opacity:.9}
.edit-cancel{background:var(--bg3);color:var(--text2)}.edit-cancel:hover{background:var(--bg4)}
.edit-toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;z-index:2000;font-size:13px;font-weight:600;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.decision{position:relative}.gap-item{position:relative}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title{font-size:14px;font-weight:600}
.card-sub{font-size:12px;color:var(--text2);margin-top:2px}
.score-badge{padding:4px 10px;border-radius:6px;font-size:13px;font-weight:700;min-width:42px;text-align:center}
.s-green{background:#22c55e20;color:var(--green)}.s-yellow{background:#eab30820;color:var(--yellow)}.s-red{background:#ef444420;color:var(--red)}.s-orange{background:#f9731620;color:var(--orange)}.s-cyan{background:#06b6d420;color:var(--cyan)}.s-accent{background:#6366f120;color:var(--accent2)}

/* Score Dimensions */
.dims{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.dim{display:flex;align-items:center;gap:8px;font-size:11px}
.dim-label{width:100px;color:var(--text3)}
.dim-bar{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.dim-fill{height:100%;border-radius:2px}
.dim-val{width:24px;color:var(--text2);text-align:right;font-weight:500}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:500;margin:1px}
.t-g{background:#22c55e18;color:var(--green)}.t-y{background:#eab30818;color:var(--yellow)}.t-r{background:#ef444418;color:var(--red)}.t-a{background:#6366f118;color:var(--accent2)}.t-c{background:#06b6d418;color:var(--cyan)}.t-o{background:#f9731618;color:var(--orange)}.t-p{background:#ec489918;color:var(--pink)}

/* Expand */
.expandable{cursor:pointer}
.expand-content{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);line-height:1.6}
.expand-content.show{display:block}
.expand-arrow{transition:.3s;color:var(--text3);font-size:10px}.expand-arrow.open{transform:rotate(180deg)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}th{color:var(--text3);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.5px}

/* Gap */
.gap-item{display:flex;align-items:flex-start;gap:10px;padding:10px;background:var(--bg3);border-radius:8px;margin-bottom:6px}
.gap-icon{font-size:16px;flex-shrink:0;margin-top:2px}
.gap-text{font-size:13px;line-height:1.5}
.gap-text strong{color:var(--text)}

/* Nav */
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:10;border-bottom:1px solid var(--border)}
.nav-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;background:var(--bg2);color:var(--text2);transition:.2s}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--accent);color:#fff}

/* Decision cards */
.decision{background:var(--bg3);border-radius:8px;padding:12px;margin-bottom:8px}
.decision-q{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--cyan)}
.decision-a{font-size:12px;color:var(--text2);line-height:1.5}
.decision-score{font-size:11px;margin-top:4px}

/* Responsive */
@media(max-width:700px){.cards{grid-template-columns:1fr}.overall{flex-direction:column;gap:20px}}

.hidden{display:none}

/* Platform Nav */
.platform-nav{position:fixed;left:0;top:0;height:100vh;width:42px;background:#0d1117;border-right:1px solid #1e293b;z-index:9999;display:flex;flex-direction:column;gap:2px;padding:8px 4px;transition:width .2s;overflow:hidden}
.platform-nav:hover{width:200px}
.platform-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#94a3b8;font-size:12px;text-decoration:none;white-space:nowrap;transition:.15s}
.platform-nav a:hover{background:#1e293b;color:#e2e8f0}
.platform-nav a.active{background:#3b82f620;color:#3b82f6}
.platform-nav .nav-icon{width:22px;text-align:center;flex-shrink:0;font-size:16px}
.platform-nav .nav-label{opacity:0;transition:opacity .2s}
.platform-nav:hover .nav-label{opacity:1}
.platform-nav .nav-divider{height:1px;background:#1e293b;margin:4px 6px}
</style>
</head>

<div class="app">
<div class="header">
  <h1>Interview Readiness Scorecard</h1>
  <p>Comprehensive scoring of every answerable question, project, decision, and difficulty from User's vault</p>
</div>

<div class="nav" id="nav"></div>
<div id="content"></div>
</div>

<script>
// Highlight active nav item
(function(){
  var path = location.pathname;
  document.querySelectorAll('.platform-nav a').forEach(function(a) {
    if (path.includes(a.getAttribute('href'))) a.classList.add('active');
  });
})();

// ==================== SCORING ENGINE ====================
// Score each item on 5 dimensions (0-20 each, total 0-100):
// 1. METRICS: Has concrete, verified numbers
// 2. DEPTH: Can go 3+ levels deep on follow-ups (HLD/LLD/interview Q&A available)
// 3. STAR: Complete Situation-Task-Action-Result structure
// 4. UNIQUE: Differentiating — not a generic intern answer
// 5. DELIVER: Can confidently deliver in 2 minutes (practiced, clear narrative)

function scoreColor(s){return s>=80?'green':s>=65?'cyan':s>=50?'yellow':s>=35?'orange':'red'}
function scoreBg(s){return s>=80?'s-green':s>=65?'s-cyan':s>=50?'s-yellow':s>=35?'s-orange':'s-red'}
function scoreTag(s){return s>=80?'t-g':s>=65?'t-c':s>=50?'t-y':s>=35?'t-o':'t-r'}

// ==================== ALL SCORED DATA ====================

let PROJECTS = [
  {
    name: "API Inventory & Compliance Portal",
    company: "Previous Company", role: "SWE",
    metrics: 19, depth: 20, star: 19, unique: 17, deliver: 18,
    metricsList: ["60% productivity improvement","40% RBI compliance lag reduction","2,000+ APIs unified","6,000+ endpoints","100s of APIs tracked"],
    hld: "React.js UI <-> Spring Boot Backend <-> Oracle DB. Scheduled sync every 4hrs from AnyPoint, GoCD, Kong Admin APIs. RBI compliance rules engine (7 rules R1-R7). Strategy pattern for compliance rules.",
    lld: "DEVPORTAL_APIDETAILS (30+ cols), DEVPORTAL_FLOWCHART_CASESTUDY (BLOB), API_SERVICENOW_RITM, API_ASSET_COMPLIANCE_DETAILS. Repository/Builder/Strategy/Filter patterns.",
    starStories: 3, interviewQAs: 21,
    keyDecisions: [
      {q:"Why Strategy pattern for compliance?", a:"Each rule is an independent check function. New RBI rules = new strategy class, zero changes to existing code. Collect ALL violations (not fail-fast) so teams fix everything in one pass.", score:92},
      {q:"Why dual-write (DB + Exchange)?", a:"DB first (source of truth, ACID), then async Exchange call. If Exchange fails, DB still correct. Retry queue handles Exchange sync. Eventual consistency acceptable for metadata.", score:88},
      {q:"Why tree view by manager hierarchy?", a:"Users said 'I need to find MY team's APIs'. Manager hierarchy matches org chart — O(n) build, O(1) expand/collapse. Beats flat list search for 2,000+ APIs.", score:85}
    ],
    difficulties: [
      {d:"SUBSTR blocker during prod Oracle cutover", how:"SUBSTR function unavailable on production Oracle version. Required formal infrastructure change request. 2-day delay but proper process followed. Learned: always test on exact prod version, not just 'Oracle'.", score:90},
      {d:"MySQL→Oracle migration — 47 query rewrites", how:"Systematically audited all 200+ queries. Created compatibility test suite. Found 3 latent bugs: NULL comparison, GROUP BY implicit column, ORDER BY ordering assumptions. Built automated validation scripts.", score:95},
      {d:"DuplicateKeyCheckFilter security pushback", how:"Senior engineer accepted vulnerability as 'low risk'. I built the filter + CachedBodyHttpServletRequest in 1 day, wrote tests, demonstrated zero-overhead. Pattern reused in 3 other services.", score:88}
    ],
    lps: ["Customer Obsession","Deliver Results","Insist on Highest Standards","Dive Deep"],
    tags: ["React.js","Spring Boot","Oracle","RBAC","RBI Compliance","OpenAPI"]
  },
  {
    name: "Partner Developer Portal",
    company: "Previous Company", role: "SWE",
    metrics: 20, depth: 20, star: 20, unique: 18, deliver: 19,
    metricsList: ["83% efficiency improvement (12→2 days)","6x faster partner onboarding","50+ fintech partners","23 production APIs","1.08 MB API catalog cached"],
    hld: "Flutter Web frontend → Spring Boot WAR on Tomcat 9.0.99 → Oracle DB. Kong API Gateway for rate limiting. JourneyId anonymous session + OAuth2 Client Credentials. AES-256 encryption.",
    lld: "SwaggerObject recursive Java record with custom StdDeserializer. Materialized Path Model for 4-level category tree (O(n) build, no recursive SQL). OncePerRequestFilter for JWT. Redis cache with explicit flush endpoint.",
    starStories: 2, interviewQAs: 12,
    keyDecisions: [
      {q:"Why spec-level simulation vs live sandbox?", a:"Live sandbox = maintain stub endpoints for 23 APIs + manage state + infrastructure cost. Spec simulation = validate against OpenAPI spec, return example response. Zero execution overhead. Partners need to understand the CONTRACT, not execute it. Spec IS the contract.", score:95},
      {q:"Why Materialized Path over Adjacency List?", a:"Adjacency List needs recursive SQL (WITH RECURSIVE) for tree traversal — slow on Oracle. Materialized Path: store '/Corporate/Payment/Bulk Payment' as string, query with LIKE '/Corporate/%'. O(n) build, reads are trivial. Beats Nested Sets too (expensive writes).", score:92},
      {q:"Why Redis flush endpoint instead of just TTL?", a:"Long TTL for performance (1.08 MB catalog). But when admin updates data, partners must see fresh data immediately. Flush endpoint = explicit invalidation. ValidateService EXCLUDED from cache because developers vary payloads to explore API contract.", score:88}
    ],
    difficulties: [
      {d:"Recursive OpenAPI schema rendering", how:"SwaggerObject has properties that are also SwaggerObjects (recursive $ref). Built custom Jackson TypeReference<Map<String, SwaggerObject>> with depth limit to prevent infinite recursion. Tested with deeply nested specs.", score:90},
      {d:"OncePerRequestFilter for JWT", how:"JWT filter was running multiple times on request forwards. OncePerRequestFilter ensures exactly-once execution per request lifecycle. Critical for auth — double-run could cause issues.", score:82}
    ],
    lps: ["Think Big","Invent and Simplify","Are Right A Lot"],
    tags: ["Spring Boot","Flutter","OpenAPI","OAuth 2.0","Kong","Redis","AES-256"]
  },
  {
    name: "High-Throughput high-throughput APIs",
    company: "Previous Company", role: "SWE",
    metrics: 20, depth: 20, star: 19, unique: 19, deliver: 19,
    metricsList: ["100+ TPS sustained","<1s latency","30/70 weighted routing","40% Centerprise cache hit rate","800ms→<50ms cache hit","99.98% Kafka write success"],
    hld: "Kong 30/70 weighted upstream routing (primary 3 nodes weight=30, secondary 5 nodes weight=70). Least-connections balancing. Redis caching with SHA-256(PAN) keys. Kafka async writes with DLQ.",
    lld: "Centerprise TTL 24hr, negative cache 1hr. JWT cache TTL = expires_in - 300s. Idempotent Kafka consumer (UNIQUE constraint). 3x retry exponential backoff (1s,2s,4s). Spring WebClient pool: 200 max connections, 80 in-flight at peak.",
    starStories: 5, interviewQAs: 8,
    keyDecisions: [
      {q:"Why least-connections over round-robin?", a:"Response times vary: Centerprise ~800ms, PAN ~200ms, Aadhaar OTP ~1.2s. Round-robin assumes equal capacity — sends same traffic to node processing 800ms Centerprise and node doing 200ms PAN. Least-connections routes to whoever finishes first = better utilization.", score:95},
      {q:"Why SHA-256(PAN) as Redis key?", a:"PAN is PII. If Redis is compromised (keyspace scan, slowlog, dashboard), raw PAN visible. SHA-256 is one-way — can look up by hash but can't reverse to get PAN. Defense in depth.", score:93},
      {q:"Why 30/70 split not 50/50?", a:"Primary cluster: 3 nodes. Secondary: 5 nodes. 30/70 matches cluster CAPACITY, not just count. Equal split would overload smaller primary. Least-connections within each upstream handles micro-balancing.", score:90},
      {q:"Why Kafka for DB writes?", a:"Decouples DB latency from API response. 200ms reduction in OTP verification response. If DB slow, API still responds fast — Kafka absorbs. DLQ catches permanent failures for manual review.", score:88}
    ],
    difficulties: [
      {d:"JWT token expiry race condition", how:"Token expires during in-flight API call → 401. Solution: TTL = expiry - 300s (5-min buffer). On 401: delete cache → regenerate → retry once. Prevents cascade of 401s from stale token.", score:92},
      {d:"Aadhaar PII compliance (RBI)", how:"Custom Log4j2 filter with regex masking for Aadhaar numbers. AES-256 encryption before any logging. Masked storage only. Verified via Splunk audit trail — zero incidents.", score:88},
      {d:"MuleSoft→Spring Boot migration", how:"Feature flags: 5%→25%→100% traffic shift. Kong routing split between old and new service. Zero downtime cutover. Rollback possible at any stage.", score:85}
    ],
    lps: ["Deliver Results","Bias for Action","Frugality"],
    tags: ["REST APIs","Redis","Kong","Kafka","MuleSoft","AES-256","Spring Boot"]
  },
  {
    name: "Collections App APIs (Internship)",
    company: "Previous Company", role: "Intern",
    metrics: 16, depth: 17, star: 17, unique: 14, deliver: 16,
    metricsList: ["500+ field agents served","30% data fetch reduction","~95% cache hit rate","700ms→180ms with cache","50 customers/page pagination"],
    hld: "Salesforce OAuth2 Client Credentials → RestTemplate → SFDC → {access_token, expires_in}. Redis cache AES-256 encrypted. Cursor-based pagination using SFDC nextRecordsUrl.",
    lld: "Redis key='sfdc_jwt_token', TTL = expires_in - 300s. Cursor-based > offset-based (SFDC cursor remembers query state, doesn't re-run SOQL). First page: {groups:[...50...], hasMore:true, nextPageToken:'01g...'}",
    starStories: 2, interviewQAs: 5,
    keyDecisions: [
      {q:"Why cursor-based over offset pagination?", a:"SFDC's cursor remembers query state — page 2 doesn't re-run full SOQL. Offset re-runs entire query + SKIP N = O(n) degradation on large datasets. For 500+ agents with large portfolios, cursor is dramatically faster.", score:87},
      {q:"Why AES-256 for Redis tokens?", a:"Defense in depth. Even if Redis compromised, tokens unusable without decryption key. Banking context = every layer secured.", score:82},
      {q:"OAuth2 Client Credentials vs Password grant?", a:"Client Credentials: server-to-server, no user session. Password grant: deprecated, requires user credentials stored on server. For backend service talking to SFDC, Client Credentials is correct and secure.", score:80}
    ],
    difficulties: [
      {d:"Rate limit violations from SFDC", how:"Without caching, every request generated new JWT token. Hit SFDC rate limits. Redis caching (95% hit rate) eliminated the problem entirely.", score:78},
      {d:"Mobile timeout errors on large portfolios", how:"Agents with 200+ customers caused 5+ second loads. Cursor pagination (50/page) + predictive caching of next page made scrolling instant.", score:80}
    ],
    lps: ["Learn and Be Curious","Ownership"],
    tags: ["Salesforce","Redis","OAuth 2.0","Spring Boot","REST APIs"]
  },
  {
    name: "Backend Scheduler + LLM Email Assistant",
    company: "Previous Company", role: "SWE",
    metrics: 18, depth: 18, star: 17, unique: 18, deliver: 17,
    metricsList: ["100s→13s (8x speedup)","200+ API services monitored","30% email drafting time reduction","15-min polling interval","Temperature=0.3"],
    hld: "Scheduler: Kong Admin API → GET /services → parallelStream() → /actuator/health + /actuator/info → bulk save Oracle. Email: MS Graph API (Application permissions) → LLM → privacy filter → draft response.",
    lld: "Health state machine: UP→DEGRADED (3 consecutive >2x avg), UP→DOWN (3 consecutive 5xx), DOWN→UP (2 consecutive 200). fixedDelay (not fixedRate) prevents overlap. LLM privacy: 3-layer (keyword routing, PII masking, domain whitelist).",
    starStories: 2, interviewQAs: 7,
    keyDecisions: [
      {q:"Why fixedDelay not fixedRate?", a:"fixedRate: starts 15 min after previous STARTED. If run takes 14 min due to timeouts, only 1 min gap — overlap risk. fixedDelay: starts 15 min after previous COMPLETED. Guarantees safe gap. With shared Oracle DB, concurrent runs = deadlocks.", score:90},
      {q:"Why internal LLM not OpenAI?", a:"RBI data localization policy + DPDP Act 2023: PII cannot leave India. Internal LLM runs on Previous Company's network. All data stays within Indian data centers. Non-negotiable for banking.", score:95},
      {q:"Why Temperature=0.3?", a:"0.0 = deterministic but robotic repetition. 0.7+ = creative but hallucination risk for emails. 0.3 = natural variation + factual grounding. Tested on 50 sample emails — best balance.", score:82},
      {q:"Why parallelStream() not CompletableFuture?", a:"Homogeneous HTTP health checks, same operation per service. parallelStream() is simpler for embarrassingly parallel. CompletableFuture better for heterogeneous async chains with dependencies.", score:85}
    ],
    difficulties: [
      {d:"Human-in-the-loop for LLM emails", how:"Regulatory requirement: even 100% accurate AI needs human accountability. LLM drafts, human approves. Zero auto-sends. Audit trail for every email.", score:88},
      {d:"LLM unavailability handling", how:"Fallback to rule-based templates keyed by intent classification. Email categorized by regex patterns → template selected → human reviews. No downtime even if LLM crashes.", score:85}
    ],
    lps: ["Ownership","Invent and Simplify","Bias for Action"],
    tags: ["Java","parallelStream","Kong","Oracle","LLM","MS Graph API","Privacy"]
  },
  {
    name: "ProjectA Platform",
    company: "Personal Project", role: "Full-Stack",
    metrics: 16, depth: 17, star: 16, unique: 15, deliver: 17,
    metricsList: ["<200ms latency all endpoints","50ms search P95 (pg_trgm)","200 concurrent users tested","4 microservices","Live at v0-freshbite.vercel.app"],
    hld: "4 microservices: User (Spring Boot), Dish (Spring Boot), Review (FastAPI), Search (FastAPI). PostgreSQL per-service. Docker Compose. Nginx gateway. GitHub Actions CI/CD.",
    lld: "Freshness algorithm: recency-weighted score = Sum(freshness_rating x decay_weight) / Sum(decay_weight). Decay: e^(-0.05 x days). Cached in Redis, recomputed on new review. Blue-green deploy with health check rollback. pg_trgm trigram index for fuzzy search.",

// ==================== COMPUTE OVERALL ====================
function computeOverall() {
  const projectAvg = PROJECTS.reduce((s,p) => s + (p.metrics+p.depth+p.star+p.unique+p.deliver)/5, 0) / PROJECTS.length;
  const lpAvg = LP_SCORES.reduce((s,l) => s + l.score, 0) / LP_SCORES.length;
  const techAvg = TECH_SCORES.reduce((s,t) => s + t.score, 0) / TECH_SCORES.length;
  const followAvg = FOLLOWUP_SCORES.reduce((s,f) => s + f.score, 0) / FOLLOWUP_SCORES.length;
  const gapPenalty = GAPS.filter(g=>g.severity==='medium').length * 2 + GAPS.filter(g=>g.severity==='high').length * 5;
  const overall = Math.round((projectAvg * 0.30 + lpAvg * 0.25 + techAvg * 0.25 + followAvg * 0.20) - gapPenalty);
  return {overall, projectAvg:Math.round(projectAvg), lpAvg:Math.round(lpAvg), techAvg:Math.round(techAvg), followAvg:Math.round(followAvg), gapPenalty};
}

  PROJECTS.forEach(p => {

            <div style="font-size:12px;color:var(--text2);line-height:1.5">${ct.notes}</div>
            ${ct.focusAreas ? `<div style="font-size:11px;color:var(--text3);margin-top:6px">Focus: ${ct.focusAreas}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

const IDATA_BASE = (location.origin.includes('localhost') ? location.origin : 'http://localhost:5678');
const IDATA_READ = IDATA_BASE + '/webhook/interview-data';
const IDATA_WRITE = IDATA_BASE + '/webhook/interview-data';
const PAGE_NAME = 'scorecard';

function idataToast(msg, ok) {
  const t = document.createElement('div');
  t.className = 'edit-toast';
  t.style.background = ok ? '#22c55e30' : '#ef444430';
  t.style.color = ok ? '#22c55e' : '#ef4444';
  t.style.border = '1px solid ' + (ok ? '#22c55e' : '#ef4444');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

async function idataLoad() {
  try {
    const r = await fetch(IDATA_READ + '?page=' + PAGE_NAME);
    const j = await r.json();
    return j.data || null;
  } catch(e) { console.warn('idataLoad failed:', e); return null; }
}

async function idataSave(key, data, index) {
  try {
    const body = {page: PAGE_NAME, key, data};
    if (typeof index === 'number') body.index = index;
    const r = await fetch(IDATA_WRITE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.success) idataToast('Saved!', true);
    else idataToast('Save failed: ' + (j.error||'unknown'), false);
    return j.success;
  } catch(e) { idataToast('Save error: ' + e.message, false); return false; }
}

async function idataSeedIfEmpty(key, defaults) {
  try {
    const r = await fetch(IDATA_READ + '?page=' + PAGE_NAME);
    const j = await r.json();
    if (!j.data || !j.data[key]) {
      await fetch(IDATA_WRITE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({page:PAGE_NAME, key, data:defaults})});
    }
  } catch(e) {}
}

// Generic edit modal
let _editResolve = null;
function openEditModal(title, fields, values) {
  return new Promise(resolve => {
    _editResolve = resolve;
    const ov = document.getElementById('sc-edit-overlay');
    let html = `<h3>${title}</h3>`;
    fields.forEach(f => {
      const val = values[f.key] !== undefined ? values[f.key] : '';
      if (f.type === 'number') {
        html += `<div class="edit-field"><label>${f.label}</label><input type="number" id="ef_${f.key}" value="${val}" min="0" max="${f.max||100}"></div>`;
      } else if (f.type === 'textarea') {
        const escaped = String(val).replace(/"/g, '&quot;').replace(/</g, '&lt;');
        html += `<div class="edit-field"><label>${f.label}</label><textarea id="ef_${f.key}" rows="${f.rows||3}">${escaped}</textarea></div>`;
      } else if (f.type === 'array') {
        const arrVal = Array.isArray(val) ? val.join('\n') : val;
        html += `<div class="edit-field"><label>${f.label} (one per line)</label><textarea id="ef_${f.key}" rows="${f.rows||3}">${arrVal}</textarea></div>`;
      } else if (f.type === 'select') {
        html += `<div class="edit-field"><label>${f.label}</label><select id="ef_${f.key}">${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      } else if (f.type === 'boolean') {
        html += `<div class="edit-field"><label>${f.label}</label><select id="ef_${f.key}"><option value="true" ${val?'selected':''}>Yes</option><option value="false" ${!val?'selected':''}>No</option></select></div>`;
      } else {
        html += `<div class="edit-field"><label>${f.label}</label><input type="text" id="ef_${f.key}" value="${String(val).replace(/"/g, '&quot;')}"></div>`;
      }
    });
    html += `<div class="edit-actions"><button class="edit-cancel" onclick="closeEditModal(null)">Cancel</button><button class="edit-save" onclick="saveEditModal()">Save</button></div>`;
    ov.querySelector('.edit-box').innerHTML = html;
    ov.classList.add('open');
  });
}

function closeEditModal(result) {
  document.getElementById('sc-edit-overlay').classList.remove('open');
  if (_editResolve) { _editResolve(result); _editResolve = null; }
}

function saveEditModal() {
  const inputs = document.querySelectorAll('#sc-edit-overlay [id^="ef_"]');
  const result = {};
  inputs.forEach(el => {
    const key = el.id.replace('ef_', '');
    if (el.type === 'number') result[key] = Number(el.value);
    else if (el.tagName === 'SELECT' && (el.options[0]?.value === 'true' || el.options[0]?.value === 'false'))
      result[key] = el.value === 'true';
    else if (el.dataset.isArray === '1' || el.closest('.edit-field')?.querySelector('label')?.textContent?.includes('one per line'))
      result[key] = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    else result[key] = el.value;
  });
  closeEditModal(result);
}

// ── Init with data loading ──
async function initEditable() {
  const data = await idataLoad();
  if (data) {
    if (data.PROJECTS) PROJECTS = data.PROJECTS;
    if (data.LP_SCORES) LP_SCORES = data.LP_SCORES;
    if (data.TECH_SCORES) TECH_SCORES = data.TECH_SCORES;
    if (data.FOLLOWUP_SCORES) FOLLOWUP_SCORES = data.FOLLOWUP_SCORES;
    if (data.GAPS) GAPS = data.GAPS;
    if (data.COMPANY_READINESS) COMPANY_READINESS = data.COMPANY_READINESS;
  } else {
    // Seed DB with defaults on first load
    idataSeedIfEmpty('PROJECTS', PROJECTS);
    idataSeedIfEmpty('LP_SCORES', LP_SCORES);
    idataSeedIfEmpty('TECH_SCORES', TECH_SCORES);
    idataSeedIfEmpty('FOLLOWUP_SCORES', FOLLOWUP_SCORES);
    idataSeedIfEmpty('GAPS', GAPS);
    idataSeedIfEmpty('COMPANY_READINESS', COMPANY_READINESS);
  }
  init();
}
