<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Hunter</title>
<style>
:root{--bg:#0a0b0f;--surface:#13141a;--surface2:#1c1d25;--surface3:#24252f;--border:#2a2b36;--text:#ebedf5;--text2:#7e8299;--accent:#7c5cfc;--accent2:#9b85ff;--accent-dim:rgba(124,92,252,.1);--green:#34d399;--green-dim:rgba(52,211,153,.1);--red:#f87171;--red-dim:rgba(248,113,113,.1);--yellow:#fbbf24;--yellow-dim:rgba(251,191,36,.1);--radius:10px;--radius-lg:14px;--shadow:0 2px 12px rgba(0,0,0,.3);--font:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;--mono:'SF Mono','Cascadia Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent2);text-decoration:none;transition:color .15s}a:hover{color:#b9a5ff}
input,select,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;outline:none}
::selection{background:var(--accent);color:#fff}

.app{display:flex;flex-direction:column;height:100vh}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:54px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
header .logo{font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--accent2)}
header .nav{display:flex;gap:2px;align-items:center}
header .nav a{padding:6px 12px;font-size:12px;color:var(--text2);border-radius:6px;transition:all .15s}
header .nav a:hover{background:var(--surface2);color:var(--text)}
header .actions{display:flex;gap:8px;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:500;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
.btn-danger{background:var(--red-dim);color:var(--red)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Layout */
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-search{padding:12px}
.sidebar-search input{width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;font-size:13px;transition:border-color .15s}
.sidebar-search input:focus{border-color:var(--accent)}
.sidebar-info{padding:6px 14px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.filters{padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border)}
.chip{padding:3px 10px;border-radius:20px;font-size:11px;border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;background:transparent}
.chip:hover{border-color:var(--accent);color:var(--accent2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.job-list{flex:1;overflow-y:auto;padding:6px}

/* Job cards */
.jc{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:1px;transition:all .12s;border-left:3px solid transparent}
.jc:hover{background:var(--surface2)}
.jc.sel{background:var(--surface2);border-left-color:var(--accent)}
.jc .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.jc .c{font-size:12px;color:var(--text2)}
.jc .m{display:flex;gap:6px;margin-top:3px;font-size:11px;color:var(--text2);align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-h{background:var(--green-dim);color:var(--green)}
.badge-m{background:var(--yellow-dim);color:var(--yellow)}
.badge-l{background:var(--red-dim);color:var(--red)}

/* Content */
.content{flex:1;overflow-y:auto;padding:28px 32px}
.content h2{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
.content .subtitle{color:var(--text2);font-size:13px;margin-bottom:24px}

/* Tabs */
.tabs{display:flex;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:11px 14px;font-size:12.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent)}
.tab sup{background:var(--accent);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:4px;font-weight:600}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:-.2px}
.card p.muted{color:var(--text2);font-size:13px;line-height:1.55}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.stat .val{font-size:26px;font-weight:700}
.stat .val.hl{color:var(--accent2)}

/* Tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--surface2);color:var(--text2)}
.tag-hit{background:var(--green-dim);color:var(--green)}
.tag-miss{background:var(--red-dim);color:var(--red);text-decoration:line-through;opacity:.7}

/* Doc generation */
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.gen-grid label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.gen-grid label:hover{border-color:var(--accent)}
.gen-grid input[type=checkbox]{accent-color:var(--accent)}

.doc-block{margin-bottom:16px}
.doc-block h4{font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.doc-block pre{background:var(--surface2);padding:14px;border-radius:8px;font-size:12.5px;font-family:var(--mono);line-height:1.6;white-space:pre-wrap;word-wrap:break-word;max-height:360px;overflow-y:auto}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 18px;font-size:12.5px;z-index:1000;box-shadow:var(--shadow);animation:slideUp .25s ease}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Spinner & Loading */
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:r .5s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2);gap:10px}

/* Progress */
.progress{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:6px}
.progress .fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--text)}
.empty p{font-size:13px;margin-bottom:16px}

/* Settings */
.settings-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:768px){.settings-2col{grid-template-columns:1fr}}

/* Settings sub-tabs */
.stabs{display:flex;gap:2px;margin-bottom:20px;background:var(--surface2);border-radius:10px;padding:3px}
.stab{flex:1;text-align:center;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:.15s}
.stab:hover{color:var(--text)}
.stab.on{background:var(--accent);color:white}
.prof-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.prof-grid label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.prof-grid input,.prof-grid textarea{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px}
.prof-grid input:focus,.prof-grid textarea:focus{border-color:var(--accent);outline:none}
.prof-wide{grid-column:1/-1}
.exp-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.exp-card .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.exp-card input,.exp-card textarea{width:100%;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:inherit}
.exp-card textarea{resize:vertical}
.prompt-ed{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.prompt-ed h4{font-size:14px;color:var(--accent2);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.prompt-ed .pdesc{font-size:12px;color:var(--text2);margin-bottom:8px}
.prompt-ed textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:var(--mono);line-height:1.5;resize:vertical}
.prompt-ed textarea:focus{border-color:var(--accent);outline:none}
.prompt-ed .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;margin-right:4px}
.tag-used{background:var(--green-dim);color:var(--green)}
.tag-custom{background:var(--accent-dim);color:var(--accent2)}
.save-float{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:14px 0;display:flex;gap:8px;justify-content:flex-end}
@media(max-width:600px){.prof-grid{grid-template-columns:1fr}.exp-card .row{grid-template-columns:1fr}}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.hint{font-size:11.5px;color:var(--text2);margin-top:4px}
.err-msg{color:var(--red);font-size:12.5px;margin-top:8px;text-align:center}

/* Onboarding */
.ob-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 50% 0%,rgba(124,92,252,.06),transparent 60%)}
.ob-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 40px;width:100%;max-width:560px;box-shadow:var(--shadow)}
.ob-box h2{font-size:20px;letter-spacing:-.3px;margin-bottom:4px}
.ob-box .sub{color:var(--text2);font-size:13px;margin-bottom:24px;line-height:1.5}
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps div{flex:1;height:3px;border-radius:2px;background:var(--surface3);transition:background .3s}
.steps .done{background:var(--green)}
.steps .cur{background:var(--accent)}
.upload{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:28px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px}
.upload:hover,.upload.over{border-color:var(--accent);background:var(--accent-dim)}
.upload .icon{font-size:28px;margin-bottom:6px}
.upload p{color:var(--text2);font-size:12px;margin-top:6px}
.upload.ok{border-color:var(--green);background:var(--green-dim)}
.upload.ok .icon{color:var(--green)}
.upload.busy{pointer-events:none;opacity:.7}
.divider{text-align:center;color:var(--text2);font-size:11px;margin:10px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.ob-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.parse-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.parse-opt{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius-lg);padding:18px;cursor:pointer;transition:all .2s;text-align:center}
.parse-opt:hover{border-color:var(--accent);background:var(--accent-dim)}
.parse-opt .po-icon{font-size:24px;margin-bottom:6px}
.parse-opt h3{font-size:14px;margin-bottom:4px}
.parse-opt p{font-size:11.5px;color:var(--text2);margin-bottom:8px;line-height:1.4}
.parse-opt .label{font-size:10px;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px;display:inline-block}
.label-free{background:var(--green-dim);color:var(--green)}
.label-rec{background:var(--accent-dim);color:var(--accent2)}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.profile-item{background:var(--surface2);padding:10px 14px;border-radius:8px}
.profile-item .pl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.profile-item .pv{font-size:13px}
.skills-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.skill{padding:3px 10px;border-radius:20px;font-size:11.5px;background:var(--accent-dim);color:var(--accent2);border:1px solid rgba(124,92,252,.15)}
.ai-key-box{margin-top:14px;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius)}

/* Banner */
.banner{padding:8px 24px;background:linear-gradient(90deg,var(--accent-dim),rgba(155,133,255,.08));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12.5px}
.banner .x{cursor:pointer;margin-left:auto;color:var(--text2);font-size:14px;padding:2px}

/* Scoring progress */
.score-bar{padding:6px 24px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px}

.hidden{display:none!important}
@media(max-width:900px){.sidebar{width:240px}}
@media(max-width:600px){.sidebar{display:none}.main{flex-direction:column}.settings-2col{grid-template-columns:1fr}.parse-opts{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}.gen-grid{grid-template-columns:1fr}}

/* User Menu */
.user-menu{position:relative}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#9b85ff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;border:2px solid transparent;user-select:none}
.user-avatar:hover{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-dim)}
.user-drop{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;min-width:210px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:100;animation:fadeIn .15s ease}
.user-drop .ud-head{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:4px}
.user-drop .ud-name{font-size:13px;font-weight:600}
.user-drop .ud-email{font-size:11px;color:var(--text2);margin-top:2px}
.user-drop a.ud-item,.user-drop .ud-item{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--text);border-radius:6px;cursor:pointer;transition:all .12s;text-decoration:none}
.user-drop .ud-item:hover{background:var(--surface2)}
.user-drop .ud-item.danger{color:var(--red)}
.user-drop .ud-item.danger:hover{background:var(--red-dim)}
.ud-sep{height:1px;background:var(--border);margin:4px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* OB Location prefs */
.ob-loc-states{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.ob-loc-states .loc-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.ob-loc-states .loc-chips{display:flex;flex-wrap:wrap;gap:4px;max-height:140px;overflow-y:auto}
.ob-section-title{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text);display:flex;align-items:center;gap:6px}
</style>

<script src="scorer.js"></script>
<script>
const API = localStorage.getItem('cp_api_url') || (location.protocol === 'file:' || location.hostname.includes('github.io')
  ? 'https://lows-whenever-medical-misc.trycloudflare.com' : location.origin);

const S = {
  view: 'loading', jobs: [], total: 0, sel: null, detail: null, docs: {},
  tab: 'browse', q: '', role: '', empFilter: '', company: '', offset: 0, limit: 200,
  empTypes: JSON.parse(localStorage.getItem('ch_emp_types') || '[]'),
  locCountry: JSON.parse(localStorage.getItem('ch_loc_country') || '["USA"]'),
  locState: JSON.parse(localStorage.getItem('ch_loc_state') || '[]'),
  locations: null,
  days: parseInt(localStorage.getItem('ch_days') || '365'),
  busy: {}, resume: localStorage.getItem('ch_resume_text') || '',
  fname: '', profile: null, step: 1, skills: [], scores: {},
  method: 'keyword', key: localStorage.getItem('ch_gemini_key') || '',
  banner: !localStorage.getItem('ch_banner_off'), aiProg: null, stats: null,
  settingsTab: 'general', userMenu: false, locOpen: false, rolesOpen: false, typesOpen: false,
  userContext: localStorage.getItem('ch_user_context') || '',
};

const RESUME_MODES = {
  reorder: {
    label: 'Reorder by Relevance',
    desc: 'Reorder experience bullets and projects by JD relevance',
    prompt: `You are an ATS resume optimizer. Create a tailored one-page ATS resume by REORDERING content for maximum relevance.\n\nStrategy:\n1. Analyze the JD — identify top 5 must-have skills and key responsibilities\n2. Reorder experience bullets: put the most JD-relevant bullets FIRST under each role\n3. Reorder projects: put the most relevant project FIRST\n4. Reorder skills: JD-matched skills come first in each category\n5. Keep all original text and metrics unchanged — only reorder\n\nRules:\n- One page only\n- Education > Skills > Experience > Projects\n- Do NOT rewrite or modify any bullet text — only reorder\n- Mirror JD section ordering in skills list\n\nJob: {title} at {company}\nJD:\n{jd}\n\nResume:\n{resume}\n{context}\nOutput tailored resume only.`
  },
  rewrite: {
    label: 'Rewrite for JD',
    desc: 'Rewrite bullets to mirror JD keywords while keeping metrics',
    prompt: `You are an ATS resume optimizer. Create a tailored one-page ATS resume by REWRITING bullets to match the JD.\n\nStrategy:\n1. Analyze JD — extract every keyword, technology, and skill mentioned\n2. Rewrite experience bullets to naturally incorporate JD keywords\n3. Keep all original metrics and numbers EXACTLY as-is (do not fabricate)\n4. Mirror JD terminology (e.g. if JD says "CI/CD pipelines", use that exact phrase)\n5. Emphasize achievements that align with JD requirements\n\nRules:\n- One page only\n- Education > Skills > Experience > Projects\n- Keep all metrics/numbers from original resume unchanged\n- No objective section\n- Every rewritten bullet must still be truthful to the original\n\nJob: {title} at {company}\nJD:\n{jd}\n\nResume:\n{resume}\n{context}\nOutput tailored resume only.`
  },
  projects: {
    label: 'Add Relevant Projects',
    desc: 'Select and highlight projects from your profile that match the JD',
    prompt: `You are an ATS resume optimizer. Create a tailored one-page ATS resume, selecting the MOST RELEVANT projects and experience from all available data.\n\nStrategy:\n1. Analyze JD — identify key skills, technologies, and responsibilities\n2. From all experience and projects provided (resume + context), select the ones most relevant to this JD\n3. If the candidate has projects not in the resume but in their context/profile that are MORE relevant, include those instead\n4. Reorder and prioritize by JD relevance\n5. Trim less relevant items to stay within one page\n\nRules:\n- One page only\n- Education > Skills > Experience > Projects\n- Use exact metrics from original sources\n- Mirror JD keywords\n- No objective section\n- Include 2-3 most relevant projects max\n\nJob: {title} at {company}\nJD:\n{jd}\n\nResume:\n{resume}\n{context}\nOutput tailored resume only.`
  }
};

const DEFAULT_PROMPTS = {
  resume: `You are an ATS resume optimizer. Create a tailored one-page ATS resume.\n\nRules:\n- Mirror JD keywords exactly\n- One page only\n- Education > Skills > Experience > Projects\n- Use metrics from the original resume\n- No objective section\n\nJob: {title} at {company}\nJD:\n{jd}\n\nResume:\n{resume}\n{context}\nOutput tailored resume only.`,

// === API ===
async function api(path) { const r = await fetch(API + path); if (!r.ok) throw new Error(`${r.status}`); return r.json(); }
function toast(msg, ok=true) { const e = document.createElement('div'); e.className = `toast ${ok?'ok':'err'}`; e.textContent = msg; document.body.appendChild(e); setTimeout(() => e.remove(), 3000); }
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function bc(s) { return s >= 70 ? 'badge-h' : s >= 50 ? 'badge-m' : 'badge-l'; }
function fmtDate(d) { if (!d) return ''; try { const dt = new Date(d); if (isNaN(dt)) return d.slice(0,10); const now = Date.now(); const diff = now - dt.getTime(); if (diff < 86400000) return 'Today'; if (diff < 172800000) return 'Yesterday'; if (diff < 604800000) return Math.floor(diff/86400000) + 'd ago'; if (diff < 2592000000) return Math.floor(diff/604800000) + 'w ago'; return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); } catch { return d.slice(0,10); } }

// === Data ===
async function loadJobs() {
  S.busy.jobs = true; render();
  try {
    const p = new URLSearchParams({ limit: S.limit, offset: 0 });
    if (S.role) p.set('role_category', S.role);
    if (S.company) p.set('company', S.company);
    if (S.q) p.set('search', S.q);
    const et = S.empTypes.length ? S.empTypes.join(',') : '';
    if (et) p.set('employment_type', et);
    if (S.locCountry.length) p.set('location_country', S.locCountry.join(','));
    if (S.locState.length) p.set('location_state', S.locState.join(','));
    if (S.days && S.days < 730) p.set('days', S.days);
    const d = await api(`/api/v1/jobs/browse?${p}`);
    S.jobs = d.jobs || []; S.total = d.total || 0; S.offset = 0;
    scoreKeyword();
  } catch(e) { console.error(e); S.jobs = []; }
  S.busy.jobs = false; render();
}

async function loadLocations() {
  try { S.locations = await api('/api/v1/jobs/locations'); render(); } catch { S.locations = null; }
}

async function loadMore() {
  const o = S.offset + S.limit;
  S.busy.more = true; render();
  try {
    const p = new URLSearchParams({ limit: S.limit, offset: o });
    if (S.role) p.set('role_category', S.role);
    if (S.q) p.set('search', S.q);
    const et = S.empTypes.length ? S.empTypes.join(',') : '';
    if (et) p.set('employment_type', et);
    if (S.locCountry.length) p.set('location_country', S.locCountry.join(','));
    if (S.locState.length) p.set('location_state', S.locState.join(','));

// === Scoring ===
function scoreKeyword() {
  if (!S.skills.length) return;
  const r = CH_SCORER.scoreAllJobs(S.skills, S.jobs);
  r.forEach(s => { S.scores[s.job_id] = s; });
  CH_SCORER.setCachedScores(CH_SCORER.getResumeHash(S.resume), r);
}

async function runAI() {
  if (!S.key) { toast('Add Gemini key first', false); return; }
  const top = sorted().slice(0, 50);
  if (!top.length) { toast('No jobs to score', false); return; }
  S.aiProg = { done: 0, total: top.length }; render();
  const fd = async id => { try { return await api(`/api/v1/jobs/browse/${id}`); } catch { return null; } };
  const r = await CH_SCORER.aiScoreBatch(S.resume, top, S.key, fd, (d, t) => { S.aiProg = { done: d, total: t }; render(); }, S.userContext);
  r.forEach(s => { S.scores[s.job_id] = s; });
  S.method = 'ai'; S.aiProg = null;
  CH_SCORER.setCachedScores(CH_SCORER.getResumeHash(S.resume), Object.values(S.scores));
  toast(`AI scored ${r.length} jobs`); render();
}

async function runML() {
  if (!S.resume) { toast('Upload resume first', false); return; }
  S.mlProg = true; render();
  try {
    const r = await api('/api/v1/ml/score', 'POST', { resume_text: S.resume, limit: 200 });
    (r.scores||[]).forEach(s => { S.scores[s.job_id] = { job_id: s.job_id, score: s.score, method: 'ml', title: s.title, company: s.company }; });
    S.method = 'ml';
    CH_SCORER.setCachedScores(CH_SCORER.getResumeHash(S.resume), Object.values(S.scores));
    toast(`ML scored ${(r.scores||[]).length} jobs`);
  } catch (e) { toast('ML scoring unavailable: ' + e.message, false); }
  S.mlProg = false; render();
}

function sorted() {
  return [...S.jobs].sort((a, b) => {
    const da = a.posted_at ? new Date(a.posted_at).getTime() : 0;
    const db = b.posted_at ? new Date(b.posted_at).getTime() : 0;
    if (da !== db) return db - da;
    return (S.scores[b.id]?.score||0) - (S.scores[a.id]?.score||0);
  });
}

// === Doc Generation ===
async function genDocs(id) {
  if (!S.key) { toast('Add Gemini key to generate docs', false); return; }
  if (!S.detail?.description) { toast('Load job detail first', false); return; }
  const checks = document.querySelectorAll('.gc:checked');
  const types = Array.from(checks).map(c => c.value);
  if (!types.length) { toast('Select at least one doc type', false); return; }
  S.busy[`g${id}`] = true; render();
  const jd = S.detail.description.substring(0, 5000);
  const ctx = S.userContext ? `\nCandidate Context:\n${S.userContext}\n` : '';
  const profileCtx = S.profile ? `\nProfile: ${JSON.stringify({experience: S.profile.experience, projects: S.profile.projects, skills: S.profile.skills}).substring(0, 2000)}` : '';
  const contextBlock = ctx + profileCtx;
  const fill = t => {
    let prompt;
    if (t === 'resume') {
      const mode = document.querySelector('input[name="rmode"]:checked')?.value;
      prompt = (mode && RESUME_MODES[mode]) ? RESUME_MODES[mode].prompt : getPrompt('resume');
    } else {
      prompt = getPrompt(t);
    }
    return prompt.replace(/\{title\}/g, S.detail.title).replace(/\{company\}/g, S.detail.company).replace(/\{jd\}/g, jd).replace(/\{resume\}/g, S.resume).replace(/\{context\}/g, contextBlock);
  };
  for (const t of types) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${S.key}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: fill(t) }] }], generationConfig: { temperature: 0.3, maxOutputTokens: 16000 } })
      });
      if (!r.ok) throw new Error(`${r.status}`);
      const d = await r.json();
      if (!S.docs[id]) S.docs[id] = {};
      S.docs[id][t] = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
      localStorage.setItem('ch_docs_' + id, JSON.stringify(S.docs[id]));
    } catch(e) { toast(`Failed: ${t} - ${e.message}`, false); }
  }
  S.busy[`g${id}`] = false; toast('Documents generated!'); render();
}

// === Resume Parsing ===
async function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const zone = document.getElementById('uz');
  S.fname = file.name;
  if (ext === 'txt') { S.resume = await file.text(); updateZone(zone); return; }
  if (ext === 'pdf') {
    if (!window.pdfjsLib) { toast('PDF parser loading', false); return; }
    try {
      if (zone) { zone.classList.add('busy'); zone.innerHTML = '<div class="icon">&#9203;</div><strong>Extracting PDF...</strong>'; }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      let t = '';
      for (let i = 1; i <= pdf.numPages; i++) { const p = await pdf.getPage(i); const c = await p.getTextContent(); t += c.items.map(x => x.str).join(' ') + '\n'; }
      S.resume = t.trim();
      if (S.resume.length < 30) throw new Error('No text');
      updateZone(zone);
    } catch { toast('Could not extract PDF text', false); if (zone) { zone.classList.remove('busy'); zone.innerHTML = '<div class="icon">&#128196;</div><strong>Drop resume or click</strong><p>PDF, DOCX, or TXT</p>'; } }
    return;
  }
  if (ext === 'docx' || ext === 'doc') {
    if (!window.mammoth) { toast('DOCX parser loading', false); return; }
    try {
      if (zone) { zone.classList.add('busy'); zone.innerHTML = '<div class="icon">&#9203;</div><strong>Extracting...</strong>'; }
      const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      S.resume = r.value.trim();
      if (S.resume.length < 30) throw new Error('No text');
      updateZone(zone);
    } catch { toast('Could not extract text', false); if (zone) { zone.classList.remove('busy'); zone.innerHTML = '<div class="icon">&#128196;</div><strong>Drop resume or click</strong><p>PDF, DOCX, or TXT</p>'; } }
    return;
  }
  toast('Unsupported file type', false);
}

function updateZone(z) {
  if (z) { z.classList.remove('busy'); z.classList.add('ok'); z.innerHTML = `<div class="icon">&#9989;</div><strong>${esc(S.fname)}</strong><p>${S.resume.length.toLocaleString()} characters</p>`; }
  const el = document.getElementById('rp'); if (el) el.value = S.resume;
}

function quickParse(text) {
  const em = text.match(/[\w.+-]+@[\w-]+\.[\w.]+/);
  const ph = text.match(/(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/);
  const li = text.match(/linkedin\.com\/in\/[\w-]+/i);
  const gh = text.match(/github\.com\/[\w-]+/i);
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let name = '';
  for (const l of lines.slice(0, 5)) { const c = l.replace(/[|·\-]/g, '').trim(); if (c.length > 2 && c.length < 50 && !c.includes('@') && !c.match(/\d{3}/) && !c.match(/linkedin|github|http/i)) { name = c; break; } }
  const skills = CH_SCORER.extractSkills(text);
  let edu = '';
  const m = text.match(/(?:B\.?S\.?|M\.?S\.?|Bachelor|Master|Ph\.?D|MBA)[\w\s,.]+(University|Institute|College)[\w\s,.]*/i);
  if (m) edu = m[0].substring(0, 120);
  return { name: name || 'Unknown', email: em?.[0] || '', phone: ph?.[0] || '', linkedin: li ? 'https://' + li[0] : '', github: gh ? 'https://' + gh[0] : '', education: edu, skills: [...new Set(skills)], target_roles: ['Software Engineer'], preferred_locations: [] };
}

async function aiParse(text, apiKey) {
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: `Parse this resume. Return ONLY valid JSON (no markdown, no code fences): {"name":"","email":"","phone":"","linkedin":"","github":"","education":"","skills":[],"target_roles":[],"preferred_locations":[],"experience_summary":""}\n\nResume:\n${text.substring(0, 8000)}` }] }], generationConfig: { temperature: 0.1, maxOutputTokens: 8192 } })
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || 'API error'); }
  const d = await r.json();
  if (d.candidates?.[0]?.finishReason === 'MAX_TOKENS') throw new Error('Response truncated — try Quick Parse instead');
  let raw = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
  raw = raw.replace(/```json\s*/g, '').replace(/```\s*/g, '');
  const j = raw.match(/\{[\s\S]*\}/);
  if (!j) throw new Error('Could not parse AI response. Try Quick Parse instead.');
  const p = JSON.parse(j[0]);
  if (!p.skills) p.skills = [];
  return p;
}

function setupOB() {
  if (S.step === 1) {
    const z = document.getElementById('uz'), fi = document.getElementById('rf'), nb = document.getElementById('nb');
    z?.addEventListener('click', () => fi?.click());
    z?.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z?.addEventListener('dragleave', () => z.classList.remove('over'));
    z?.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fi?.addEventListener('change', () => { if (fi.files.length) handleFile(fi.files[0]); });
    nb?.addEventListener('click', () => {
      const t = document.getElementById('rp')?.value?.trim() || S.resume;
      if (!t || t.length < 50) { toast('Resume needs 50+ characters', false); return; }
      S.resume = t; localStorage.setItem('ch_resume_text', t); S.step = 2; render();
    });
  }
  if (S.step === 2) {
    document.getElementById('opt-q')?.addEventListener('click', () => {
      S.profile = quickParse(S.resume); S.skills = S.profile.skills || [];
      localStorage.setItem('ch_parsed_profile', JSON.stringify(S.profile)); S.step = 3; render();
    });
    document.getElementById('opt-a')?.addEventListener('click', () => {
      document.getElementById('akb')?.classList.remove('hidden'); document.getElementById('oak')?.focus();
    });
    document.getElementById('apb')?.addEventListener('click', async () => {
      const k = document.getElementById('oak')?.value?.trim();
      const err = document.getElementById('oe');
      if (!k) { err.textContent = 'Enter API key'; return; }
      const btn = document.getElementById('apb');
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Parsing...';
      try {
        const p = await aiParse(S.resume, k);
        S.key = k; localStorage.setItem('ch_gemini_key', k);
        S.profile = p; S.skills = p.skills || [];
        localStorage.setItem('ch_parsed_profile', JSON.stringify(p)); S.step = 3; render();
      } catch(e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Parse with AI'; }
    });
  }
}

function renderLocFilter() {
  const loc = S.locations;
  const countries = loc ? Object.keys(loc.countries || {}).sort() : [];
  if (!countries.length && !S.locCountry.length) return '';
  const hasFilter = S.locCountry.length > 0 || S.locState.length > 0;
  const label = hasFilter ? S.locCountry.join(', ') + (S.locState.length ? ` (${S.locState.length})` : '') : 'All Locations';
  let html = `<div style="padding:4px 12px;border-bottom:1px solid var(--border)">
    <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="S.locOpen=!S.locOpen;render()">
      <span style="font-size:11px;color:var(--text2)">Location: <strong style="color:${hasFilter?'var(--accent2)':'var(--text2)'}">${esc(label)}</strong></span>
      <span style="font-size:10px;color:var(--text2)">${S.locOpen?'&#9650;':'&#9660;'}</span>
    </div>`;
  if (S.locOpen) {
    html += `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">
      <div class="chip ${!hasFilter?'on':''}" onclick="clearLocFilter()" style="font-size:10px;padding:2px 8px">All</div>
      ${countries.map(c => {
        const cnt = loc.countries[c] || 0;
        return `<div class="chip ${S.locCountry.includes(c)?'on':''}" onclick="toggleLocCountry('${esc(c)}')" style="font-size:10px;padding:2px 8px">${esc(c)} <sup>${cnt}</sup></div>`;
      }).join('')}
    </div>`;
    const selCountries = S.locCountry.filter(c => loc?.states?.[c]);
    for (const c of selCountries) {
      const states = loc.states[c] || {};
      const codes = Object.keys(states).sort();
      if (!codes.length) continue;
      const nameMap = c === 'USA' ? US_STATES_MAP : c === 'Canada' ? CA_PROVINCES_MAP : {};
      const selCnt = codes.filter(s => S.locState.includes(s)).length;
      html += `<div style="margin-top:4px">
        <div style="font-size:10px;color:var(--text2);margin-bottom:3px">${esc(c)}${selCnt ? ` (${selCnt}/${codes.length})` : ''}</div>
        <div style="display:flex;flex-wrap:wrap;gap:3px;max-height:120px;overflow-y:auto">
        ${codes.map(s => {
          const label = nameMap[s] || s;
          const cnt = states[s] || 0;
          return `<div class="chip ${S.locState.includes(s)?'on':''}" onclick="toggleLocState('${esc(s)}')" style="font-size:10px;padding:2px 7px">${esc(label)} <sup>${cnt}</sup></div>`;
        }).join('')}
        </div>
      </div>`;
    }
  }
  html += '</div>';
  return html;
}

      return `<div class="doc-block"><h4><span>${esc(l)}</span><button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(${JSON.stringify(c).replace(/</g,'\\u003c')});toast('Copied!')">Copy</button></h4><pre>${esc(dc)}</pre></div>`;
    }).join('') : ''}

    ${d?.description ? `<div class="card" style="margin-top:14px"><h3>Job Description</h3><pre style="background:var(--surface2);padding:14px;border-radius:8px;font-size:12.5px;font-family:var(--mono);line-height:1.6;white-space:pre-wrap;max-height:500px;overflow-y:auto">${esc(d.description)}</pre></div>` : ''}

    ${j.role_category ? `<div style="margin-top:6px"><span class="tag">${esc(j.role_category)}</span>${j.ats && j.ats !== j.source ? ` <span class="tag">${esc(j.ats)}</span>` : ''}</div>` : ''}`;
}

function renderStatsTab() {
  if (!S.stats) return '<div class="loading"><span class="spin"></span> Loading stats...</div>';
  const s = S.stats;
  return `<h2>Job Pool</h2><p class="subtitle">Overview of the shared job pool from 69 company boards.</p>
    <div class="stats-grid">
      <div class="stat"><div class="label">Active</div><div class="val hl">${(s.active||0).toLocaleString()}</div></div>
      <div class="stat"><div class="label">Closed</div><div class="val">${s.closed||0}</div></div>
      <div class="stat"><div class="label">Companies</div><div class="val">${Object.keys(s.by_company||{}).length}</div></div>
      <div class="stat"><div class="label">Last Fetch</div><div class="val" style="font-size:13px">${esc(s.last_fetched||'Never')}</div></div>
    </div>
    ${S.skills.length ? `<div class="card"><h3>Job Scoring</h3><p class="muted" style="margin-bottom:10px">Score jobs against your resume for best fit.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button class="btn btn-primary" onclick="runML()" ${S.mlProg?'disabled':''}>${S.mlProg?'Scoring...':'ML Score (Free)'}</button><button class="btn btn-ghost" onclick="runAI()" ${!S.key||S.aiProg?'disabled':''}>${S.aiProg?'Scoring...':'Gemini AI Score'}</button></div><p class="hint" style="font-size:11px;color:var(--muted)">ML Score runs on server (free, no key). Gemini AI uses your key for higher accuracy.</p></div>` : ''}
    <div class="settings-2col">
      <div class="card"><h3>By Source</h3><table><thead><tr><th>Source</th><th>Count</th></tr></thead><tbody>${Object.entries(s.by_source||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h3>By Role</h3><table><thead><tr><th>Role</th><th>Count</th></tr></thead><tbody>${Object.entries(s.by_role||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="card"><h3>Top Companies</h3><table><thead><tr><th>Company</th><th>Active</th></tr></thead><tbody>${Object.entries(s.by_company||{}).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>`;
}

function renderSettings() {
  const st = S.settingsTab;
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h2>Settings</h2></div>
    <div class="stabs">
      <div class="stab ${st==='general'?'on':''}" onclick="S.settingsTab='general';render()">General</div>
      <div class="stab ${st==='profile'?'on':''}" onclick="S.settingsTab='profile';render()">Profile Data</div>
      <div class="stab ${st==='prompts'?'on':''}" onclick="S.settingsTab='prompts';render()">AI Prompts</div>
    </div>
    ${st==='general' ? renderSettingsGeneral() : st==='profile' ? renderSettingsProfile() : renderSettingsPrompts()}`;
}

function renderSettingsGeneral() {
  return `<div class="settings-2col">
    <div class="card"><h3>Gemini API Key</h3>
      <p class="muted" style="margin-bottom:10px">${S.key ? 'Key set. Used for AI scoring and docs.' : 'Required for AI features.'} <a href="https://aistudio.google.com/apikey" target="_blank">Get free key</a></p>
      <div class="field"><input id="sk" type="password" placeholder="AIzaSy..." value="${esc(S.key)}"></div>
      <div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="saveKey()">Save</button>${S.key?'<button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="rmKey()">Remove</button>':''}</div>
    </div>
    <div class="card"><h3>Resume</h3>
      <p class="muted" style="margin-bottom:10px">${S.resume ? `${S.resume.length.toLocaleString()} chars, ${S.skills.length} skills` : 'No resume loaded'}</p>
      <button class="btn btn-ghost btn-sm" onclick="S.view='onboarding';S.step=1;render()">Re-upload</button>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><h3>API Server</h3>
    <div class="field"><label>Pipeline Server URL</label><input id="su" value="${esc(API)}" style="font-family:var(--mono);font-size:12px"></div>
    <button class="btn btn-ghost btn-sm" onclick="let u=document.getElementById('su')?.value?.replace(/\\/+$/,'');if(u){localStorage.setItem('cp_api_url',u);location.reload()}">Update</button>
  </div>
  ${S.skills.length ? `<div class="card" style="margin-top:14px"><h3>Extracted Skills (${S.skills.length})</h3><div class="skills-list" style="margin-top:8px">${S.skills.map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div></div>` : ''}`;
}

function renderSettingsProfile() {
  const p = S.profile || {};
  const exp = p.experience || [];
  const proj = p.projects || [];
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div><p class="muted">Your profile is used by all AI features — resume generation, cover letters, scoring, and interview prep.</p></div>
    <button class="btn btn-primary" onclick="saveProfileFromSettings()">Save Profile</button>
  </div>

  <div class="card"><h3>Identity & Contact</h3>
    <div class="prof-grid">
      <div><label>Full Name</label><input id="sp_name" value="${esc(p.name||'')}"></div>
      <div><label>Email</label><input id="sp_email" value="${esc(p.email||'')}"></div>
      <div><label>Phone</label><input id="sp_phone" value="${esc(p.phone||'')}"></div>
      <div><label>LinkedIn</label><input id="sp_linkedin" value="${esc(p.linkedin||'')}"></div>
      <div><label>GitHub</label><input id="sp_github" value="${esc(p.github||'')}"></div>
      <div><label>Portfolio</label><input id="sp_portfolio" value="${esc(p.portfolio||'')}"></div>
      <div><label>Location</label><input id="sp_location" value="${esc(p.location||'')}"></div>
      <div><label>Visa Status</label><input id="sp_visa" value="${esc(p.visa||'')}"></div>
      <div><label>Availability</label><input id="sp_availability" value="${esc(p.availability||'')}"></div>
    </div>
  </div>

  <div class="card"><h3>Education</h3>
    <div class="prof-grid">
      <div><label>University</label><input id="sp_school" value="${esc(p.education||'')}"></div>
      <div><label>Degree</label><input id="sp_degree" value="${esc(p.degree||'')}"></div>
      <div><label>GPA</label><input id="sp_gpa" value="${esc(p.gpa||'')}"></div>
      <div class="prof-wide"><label>Coursework</label><input id="sp_coursework" value="${esc((p.coursework||[]).join(', '))}"></div>
    </div>
  </div>

  <div class="card"><h3>Technical Skills</h3>
    <p class="muted" style="margin-bottom:10px">Comma-separated. These are used for keyword matching and scoring.</p>
    <div class="prof-grid" style="grid-template-columns:1fr">
      <div><label>All Skills</label><textarea id="sp_skills" rows="3" style="font-size:13px">${esc((p.skills||[]).join(', '))}</textarea></div>
    </div>
  </div>

  <div class="card"><h3>Context About You</h3>
    <p class="muted" style="margin-bottom:10px">Free-text context used by AI scoring and document generation. Stored locally only.</p>
    <div class="prof-grid" style="grid-template-columns:1fr">
      <div><textarea id="sp_context" rows="4" placeholder="E.g. I'm a grad student targeting SDE internships, strong in backend/distributed systems..." style="font-size:13px">${esc(S.userContext)}</textarea></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Work Experience</h3>
      <button class="btn btn-ghost btn-sm" onclick="addExpFromSettings()">+ Add</button>
    </div>
    ${exp.length ? exp.map((e,i) => `<div class="exp-card">
      <div class="row">
        <div><label style="font-size:11px;color:var(--text2)">Title</label><input id="se_title_${i}" value="${esc(e.title||'')}"></div>
        <div><label style="font-size:11px;color:var(--text2)">Company</label><input id="se_company_${i}" value="${esc(e.company||'')}"></div>
        <div><label style="font-size:11px;color:var(--text2)">Dates</label><input id="se_dates_${i}" value="${esc(e.dates||'')}"></div>
      </div>
      <label style="font-size:11px;color:var(--text2)">Bullets (one per line)</label>
      <textarea id="se_bullets_${i}" rows="3">${esc((e.bullets||[]).join('\\n'))}</textarea>
      <button class="btn btn-ghost btn-sm" style="margin-top:6px;color:var(--red)" onclick="rmExpFromSettings(${i})">Remove</button>
    </div>`).join('') : '<p class="muted">No experience entries. Click + Add to create one.</p>'}
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Projects</h3>
      <button class="btn btn-ghost btn-sm" onclick="addProjFromSettings()">+ Add</button>
    </div>
    ${proj.length ? proj.map((pr,i) => `<div class="exp-card">
      <div class="row">
        <div><label style="font-size:11px;color:var(--text2)">Name</label><input id="sp_pname_${i}" value="${esc(pr.name||'')}"></div>
        <div><label style="font-size:11px;color:var(--text2)">Tech Stack</label><input id="sp_ptech_${i}" value="${esc(pr.tech||'')}"></div>
        <div><label style="font-size:11px;color:var(--text2)">URL</label><input id="sp_purl_${i}" value="${esc(pr.url||'')}"></div>
      </div>
      <label style="font-size:11px;color:var(--text2)">Description</label>
      <textarea id="sp_pdesc_${i}" rows="2">${esc(pr.description||'')}</textarea>
      <button class="btn btn-ghost btn-sm" style="margin-top:6px;color:var(--red)" onclick="rmProjFromSettings(${i})">Remove</button>
    </div>`).join('') : '<p class="muted">No projects. Click + Add to create one.</p>'}
  </div>

  <div class="card"><h3>Target Roles</h3>
    <div class="prof-grid" style="grid-template-columns:1fr">
      <div><label>Target Roles (comma-separated)</label><input id="sp_roles" value="${esc((p.target_roles||[]).join(', '))}"></div>
      <div><label>Preferred Locations (comma-separated)</label><input id="sp_locations" value="${esc((p.preferred_locations||[]).join(', '))}"></div>
    </div>
  </div>

  <div class="card"><h3>Experience Summary</h3>
    <textarea id="sp_summary" rows="4" style="width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px">${esc(p.experience_summary||'')}</textarea>
  </div>

  <div class="save-float"><button class="btn btn-ghost" onclick="S.profile=null;localStorage.removeItem('ch_parsed_profile');S.skills=[];toast('Profile cleared');render()">Clear Profile</button><button class="btn btn-primary" onclick="saveProfileFromSettings()">Save Profile</button></div>`;
}

function renderSettingsPrompts() {
  const custom = loadPrompts();
  const defs = [
    { key: 'resume', name: 'Resume Generation', desc: 'Creates a tailored ATS-optimized resume. Variables: {title}, {company}, {jd}, {resume}', rows: 10 },
    { key: 'cover_letter', name: 'Cover Letter', desc: 'Generates a tailored cover letter. Variables: {title}, {company}, {jd}, {resume}', rows: 8 },
    { key: 'outreach', name: 'Outreach Messages', desc: 'LinkedIn DM, cold email, referral ask. Variables: {title}, {company}, {jd}, {resume}', rows: 6 },
    { key: 'ats_audit', name: 'ATS Audit', desc: 'Keyword coverage analysis. Variables: {title}, {company}, {jd}, {resume}', rows: 6 },
    { key: 'interview_prep', name: 'Interview Prep', desc: 'Behavioral + technical questions. Variables: {title}, {company}, {jd}, {resume}', rows: 6 },
    { key: 'scoring', name: 'AI Scoring', desc: 'Resume-job match scoring. Variables: {title}, {company}, {jd}, {resume}', rows: 6 },
  ];
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div><p class="muted">Customize the AI prompts used for document generation and scoring. Use {title}, {company}, {jd}, {resume} as placeholders.</p></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="if(confirm('Reset all prompts to defaults?')){localStorage.removeItem('ch_prompts');toast('Prompts reset');render()}">Reset All</button>
      <button class="btn btn-primary" onclick="savePromptsFromSettings()">Save Prompts</button>
    </div>
  </div>
  ${defs.map(d => {
    const isCustom = !!custom[d.key];
    const val = custom[d.key] || DEFAULT_PROMPTS[d.key] || '';
    return `<div class="prompt-ed">
      <h4><span>${esc(d.name)}</span><span>${isCustom ? '<span class="tag tag-custom">Custom</span>' : '<span class="tag tag-used">Default</span>'}${isCustom ? `<button class="btn btn-ghost btn-sm" style="margin-left:6px;font-size:11px" onclick="resetOnePrompt('${d.key}')">Reset</button>` : ''}</span></h4>
      <p class="pdesc">${esc(d.desc)}</p>
      <textarea id="pr_${d.key}" rows="${d.rows}">${esc(val)}</textarea>
    </div>`;
  }).join('')}
  <div class="save-float"><button class="btn btn-primary" onclick="savePromptsFromSettings()">Save Prompts</button></div>`;
}

function saveProfileFromSettings() {
  const g = id => document.getElementById(id)?.value?.trim() || '';
  const p = S.profile || {};
  p.name = g('sp_name'); p.email = g('sp_email'); p.phone = g('sp_phone');
  p.linkedin = g('sp_linkedin'); p.github = g('sp_github'); p.portfolio = g('sp_portfolio');
  p.location = g('sp_location'); p.visa = g('sp_visa'); p.availability = g('sp_availability');
  p.education = g('sp_school'); p.degree = g('sp_degree'); p.gpa = g('sp_gpa');
  p.coursework = g('sp_coursework').split(',').map(s=>s.trim()).filter(Boolean);
  p.skills = g('sp_skills').split(',').map(s=>s.trim()).filter(Boolean);
  p.target_roles = g('sp_roles').split(',').map(s=>s.trim()).filter(Boolean);
  p.preferred_locations = g('sp_locations').split(',').map(s=>s.trim()).filter(Boolean);
  p.experience_summary = g('sp_summary');

  const exp = []; let ei = 0;
  while (document.getElementById('se_title_' + ei)) {
    const title = g('se_title_' + ei), company = g('se_company_' + ei), dates = g('se_dates_' + ei);
    const bullets = (document.getElementById('se_bullets_' + ei)?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if (title || company) exp.push({ title, company, dates, bullets });
    ei++;
  }
  p.experience = exp;

  const proj = []; let pi = 0;
  while (document.getElementById('sp_pname_' + pi)) {
    const name = g('sp_pname_' + pi), tech = g('sp_ptech_' + pi), url = g('sp_purl_' + pi);
    const description = g('sp_pdesc_' + pi);
    if (name) proj.push({ name, tech, url, description });
    pi++;
  }
  p.projects = proj;

  S.profile = p; S.skills = p.skills || [];
  localStorage.setItem('ch_parsed_profile', JSON.stringify(p));
  saveContext();
  toast('Profile saved'); render();
}

function addExpFromSettings() {
  if (!S.profile) S.profile = {};
  if (!S.profile.experience) S.profile.experience = [];
  S.profile.experience.push({ title: '', company: '', dates: '', bullets: [] });
  localStorage.setItem('ch_parsed_profile', JSON.stringify(S.profile));
  render();
}
function rmExpFromSettings(i) {
  if (!S.profile?.experience) return;
  S.profile.experience.splice(i, 1);
  localStorage.setItem('ch_parsed_profile', JSON.stringify(S.profile));
  render();
}
function addProjFromSettings() {
  if (!S.profile) S.profile = {};
  if (!S.profile.projects) S.profile.projects = [];
  S.profile.projects.push({ name: '', tech: '', url: '', description: '' });
  localStorage.setItem('ch_parsed_profile', JSON.stringify(S.profile));
  render();
}
function rmProjFromSettings(i) {
  if (!S.profile?.projects) return;
  S.profile.projects.splice(i, 1);
  localStorage.setItem('ch_parsed_profile', JSON.stringify(S.profile));
  render();
}

function savePromptsFromSettings() {
  const custom = loadPrompts();
  const keys = ['resume','cover_letter','outreach','ats_audit','interview_prep','scoring'];
  keys.forEach(k => {
    const el = document.getElementById('pr_' + k);
    if (!el) return;
    const val = el.value.trim();
    if (val && val !== DEFAULT_PROMPTS[k]) custom[k] = val;
    else delete custom[k];
  });
  savePrompts(custom);
  toast('Prompts saved'); render();
}

function resetOnePrompt(key) {
  const custom = loadPrompts();
  delete custom[key];
  savePrompts(custom);
  toast(key.replace(/_/g,' ') + ' reset to default'); render();
}

function saveKey() { const k = document.getElementById('sk')?.value?.trim(); if (!k) { toast('Enter a key', false); return; } S.key = k; localStorage.setItem('ch_gemini_key', k); toast('Key saved'); render(); }
function rmKey() { S.key = ''; localStorage.removeItem('ch_gemini_key'); toast('Key removed'); render(); }
function setTab(t) { S.tab = t; if (t === 'stats' && !S.stats) loadStats(); render(); }
function selectJob(id) {
  S.sel = S.jobs.find(j => j.id === id) || null; S.detail = null;
  try { const c = localStorage.getItem('ch_docs_' + id); if (c) S.docs[id] = JSON.parse(c); } catch {}
  render(); if (S.sel) loadDetail(id);
}

// === Render ===
function render() {
  const el = document.getElementById('app');
  if (S.view === 'loading') { el.innerHTML = '<div class="loading"><span class="spin"></span> Loading...</div>'; return; }
  if (S.view === 'onboarding') { el.innerHTML = renderOB(); setupOB(); } else { el.innerHTML = renderApp(); }
}

// === Init ===
document.addEventListener('click', () => { if (S.userMenu) { S.userMenu = false; render(); } });
(async function() {
  if (S.resume && S.profile) { S.view = 'app'; render(); loadJobs(); loadStats(); loadLocations(); }
  else { S.view = 'onboarding'; S.step = 1; render(); }
})();
</script>
<script src="config.js"></script>
</body>
</html>
