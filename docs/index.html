<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Pipeline</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232736;--border:#2d3148;--text:#e4e6f0;--text2:#8b8fa8;--accent:#6366f1;--accent2:#818cf8;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent2);text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:14px}
button{cursor:pointer}

.app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
header .user-info .name{color:var(--text)}
.btn{padding:8px 16px;border-radius:var(--radius);border:none;font-weight:500;font-size:13px;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent2)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}

.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:400px}
.auth-box h2{font-size:24px;margin-bottom:8px;text-align:center}
.auth-box p{color:var(--text2);text-align:center;margin-bottom:24px;font-size:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.auth-box .btn{width:100%;padding:12px;font-size:15px;margin-top:8px}
.auth-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--text2)}
.error-msg{color:var(--red);font-size:13px;margin-top:8px;text-align:center}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border)}
.sidebar-header input{width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none;font-size:13px}
.sidebar-count{padding:6px 16px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sidebar-filters{padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border)}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.job-list{flex:1;overflow-y:auto;padding:8px}
.job-card{padding:10px 12px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px;transition:background .15s}
.job-card:hover{background:var(--surface2)}
.job-card.active{background:var(--surface2);border-left:3px solid var(--accent)}
.job-card .title{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-card .company{font-size:12px;color:var(--text2)}
.job-card .meta{display:flex;gap:6px;margin-top:4px;font-size:11px;color:var(--text2);align-items:center}
.score-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.score-high{background:rgba(34,197,94,.15);color:var(--green)}
.score-mid{background:rgba(234,179,8,.15);color:var(--yellow)}
.score-low{background:rgba(239,68,68,.15);color:var(--red)}

.content{flex:1;overflow-y:auto;padding:24px}
.content-header{margin-bottom:24px}
.content-header h2{font-size:22px;font-weight:700;margin-bottom:4px}
.content-header p{color:var(--text2);font-size:14px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0;padding:0 24px;background:var(--surface)}
.tab{padding:12px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;position:relative}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.tab .badge{position:absolute;top:6px;right:4px;background:var(--accent);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:28px;font-weight:700;margin-top:4px}
.stat-card .value.accent{color:var(--accent2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:600;margin-bottom:12px}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:var(--surface2)}

.source-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--surface2);color:var(--text2);margin:2px}

.job-detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.job-detail-header h2{font-size:20px;font-weight:700}
.job-detail-header .company{font-size:16px;color:var(--accent2)}
.job-detail-header .location{font-size:13px;color:var(--text2);margin-top:4px}

.doc-section{margin-bottom:20px}
.doc-section h4{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--accent2);display:flex;justify-content:space-between;align-items:center}
.doc-section pre{background:var(--surface2);padding:16px;border-radius:var(--radius);font-size:13px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;max-height:400px;overflow-y:auto}

.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;font-size:13px;z-index:1000;animation:slideIn .3s ease}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2);gap:12px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state h3{font-size:18px;margin-bottom:8px;color:var(--text)}
.empty-state p{font-size:14px;margin-bottom:20px}

.progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.settings-grid{grid-template-columns:1fr}}

.load-more{text-align:center;padding:12px}
.load-more button{width:100%}

@media(max-width:900px){.sidebar{width:240px}}
@media(max-width:600px){.sidebar{display:none}.main{flex-direction:column}}

.hidden{display:none!important}

/* Onboarding wizard */
.onboarding-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.onboarding-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:600px}
.onboarding-box h2{font-size:22px;margin-bottom:4px}
.onboarding-box .subtitle{color:var(--text2);font-size:14px;margin-bottom:24px}
.onboarding-steps{display:flex;gap:8px;margin-bottom:28px}
.onboarding-step{flex:1;height:4px;border-radius:2px;background:var(--surface2);transition:background .3s}
.onboarding-step.done{background:var(--green)}
.onboarding-step.active{background:var(--accent)}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:16px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent)}
.upload-zone p{color:var(--text2);font-size:13px;margin-top:8px}
.upload-zone .icon{font-size:32px;margin-bottom:8px}
.or-divider{text-align:center;color:var(--text2);font-size:12px;margin:12px 0;position:relative}
.or-divider::before,.or-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.or-divider::before{left:0}
.or-divider::after{right:0}
.parsed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.parsed-grid .parsed-item{background:var(--surface2);padding:10px 14px;border-radius:var(--radius)}
.parsed-grid .parsed-item .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.parsed-grid .parsed-item .value{font-size:13px;color:var(--text)}
.parsed-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.parsed-skills .skill-tag{padding:4px 10px;border-radius:20px;font-size:12px;background:rgba(99,102,241,.15);color:var(--accent2);border:1px solid rgba(99,102,241,.2)}
.onboarding-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
@media(max-width:500px){.parsed-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const API = localStorage.getItem('cp_api_url') || (location.protocol === 'file:' || location.hostname.includes('github.io')
  ? 'https://specialties-cycles-buttons-olympic.trycloudflare.com'
  : location.origin);

const state = {
  token: localStorage.getItem('cp_token') || '',
  user: null,
  jobs: [],
  totalJobs: 0,
  selectedJob: null,
  selectedJobDocs: null,
  tasks: [],
  metrics: null,
  activeTab: 'dashboard',
  searchQuery: '',
  roleFilter: '',
  sourceFilter: '',
  jobsOffset: 0,
  jobsLimit: 100,
  loading: {},
  profileText: '',
  prefBlacklist: '',
  prefRoles: '',
  prefMinScore: 30,
  prefLocations: '',
  activeTasks: {},
  onboarding: false,
  onboardingStep: 1,
  parsedProfile: null,
  resumeText: '',
};

async function api(method, path, body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (state.token) opts.headers['Authorization'] = `Bearer ${state.token}`;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (r.status === 204) return {};
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw { status: r.status, ...data };
  return data;
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// === Auth ===
async function login(email, password) {
  const d = await api('POST', '/api/v1/auth/login', { email, password });
  state.token = d.token;
  state.user = d.user;
  localStorage.setItem('cp_token', d.token);
  render();
  loadDashboard();
}

async function register(name, email, password) {
  const d = await api('POST', '/api/v1/auth/register', { name, email, password });
  state.token = d.token;
  state.user = d.user;
  localStorage.setItem('cp_token', d.token);
  state.onboarding = true;
  state.onboardingStep = 1;
  render();
}

function logout() {
  state.token = '';
  state.user = null;
  state.jobs = [];
  state.totalJobs = 0;
  localStorage.removeItem('cp_token');
  render();
}

async function loadUser() {
  if (!state.token) return;
  try {
    state.user = await api('GET', '/api/v1/auth/me');
    // Check if profile is set — if not, show onboarding
    try {
      const profile = await api('GET', '/api/v1/profile/');
      if (!profile.profile_json || profile.profile_json.length < 50) {
        state.onboarding = true;
        state.onboardingStep = 1;
      }
    } catch {}
    render();
    if (!state.onboarding) loadDashboard();
  } catch { logout(); }
}

// === Data Loading ===
async function loadDashboard() {
  state.loading.dashboard = true; render();
  try {
    const params = new URLSearchParams({ limit: String(state.jobsLimit), offset: '0' });
    if (state.sourceFilter) params.set('source', state.sourceFilter);
    if (state.roleFilter) params.set('role_category', state.roleFilter);
    if (state.searchQuery) params.set('search', state.searchQuery);

    const [metrics, jobsData, tasks] = await Promise.all([
      api('GET', '/api/v1/metrics'),
      api('GET', `/api/v1/jobs/?${params}`),
      api('GET', '/api/v1/tasks/'),
    ]);
    state.metrics = metrics;
    state.jobs = jobsData.jobs || [];
    state.totalJobs = jobsData.total || 0;
    state.jobsOffset = 0;
    state.tasks = Array.isArray(tasks) ? tasks : (tasks.tasks || []);
  } catch(e) { console.error('Dashboard load:', e); }
  state.loading.dashboard = false; render();
}

async function loadMoreJobs() {
  const newOffset = state.jobsOffset + state.jobsLimit;
  state.loading.moreJobs = true; render();
  try {
    const params = new URLSearchParams({ limit: String(state.jobsLimit), offset: String(newOffset) });
    if (state.sourceFilter) params.set('source', state.sourceFilter);
    if (state.roleFilter) params.set('role_category', state.roleFilter);
    if (state.searchQuery) params.set('search', state.searchQuery);
    const d = await api('GET', `/api/v1/jobs/?${params}`);
    state.jobs = state.jobs.concat(d.jobs || []);
    state.totalJobs = d.total || state.totalJobs;
    state.jobsOffset = newOffset;
  } catch(e) { toast('Failed to load more jobs', 'error'); }
  state.loading.moreJobs = false; render();
}

async function searchJobs() {
  state.jobsOffset = 0;
  state.loading.dashboard = true; render();
  try {
    const params = new URLSearchParams({ limit: String(state.jobsLimit), offset: '0' });
    if (state.sourceFilter) params.set('source', state.sourceFilter);
    if (state.roleFilter) params.set('role_category', state.roleFilter);
    if (state.searchQuery) params.set('search', state.searchQuery);
    const d = await api('GET', `/api/v1/jobs/?${params}`);
    state.jobs = d.jobs || [];
    state.totalJobs = d.total || 0;
  } catch(e) { console.error(e); }
  state.loading.dashboard = false; render();
}

let _searchTimer;
function onSearchInput(val) {
  state.searchQuery = val;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(searchJobs, 400);
}

async function loadJobDocs(jobId) {
  state.loading.docs = true; render();
  try {
    const d = await api('GET', `/api/v1/documents/${jobId}`);
    state.selectedJobDocs = d.documents || [];
  } catch {
    state.selectedJobDocs = [];
  }
  state.loading.docs = false; render();
}

async function fetchJobs() {
  state.loading.fetch = true; render();
  try {
    const d = await api('POST', '/api/v1/jobs/fetch', { sources: null, intern_only: false });
    toast(`Fetching jobs from 69 company boards...`);
    trackTask(d.task_id, 'fetch_jobs', () => loadDashboard());
  } catch(e) { toast(e.detail || e.error || 'Fetch failed', 'error'); }
  state.loading.fetch = false; render();
}

async function runPipeline() {
  state.loading.pipeline = true; render();
  try {
    const profile = await api('GET', '/api/v1/profile/');
    if (!profile.profile_json || profile.profile_json.length < 50) {
      toast('Add your career profile first (Profile tab)', 'error');
      state.loading.pipeline = false; render(); return;
    }
    const d = await api('POST', '/api/v1/pipeline/run', { min_score: 30, max_jobs: 20 });
    toast('Pipeline started');
    trackTask(d.task_id, 'pipeline', () => loadDashboard());
  } catch(e) { toast(e.detail || e.error || 'Pipeline failed', 'error'); }
  state.loading.pipeline = false; render();
}

async function scoreJobs() {
  state.loading.score = true; render();
  try {
    const d = await api('POST', '/api/v1/pipeline/score', {});
    toast('Scoring started');
    trackTask(d.task_id, 'score', () => loadDashboard());
  } catch(e) { toast(e.detail || e.error || 'Scoring failed', 'error'); }
  state.loading.score = false; render();
}

async function generateDocs(jobId) {
  state.loading[`gen_${jobId}`] = true; render();
  try {
    const d = await api('POST', `/api/v1/pipeline/generate/${jobId}`, {});
    toast('Doc generation started');
    trackTask(d.task_id, 'generate', () => { loadDashboard(); loadJobDocs(jobId); });
  } catch(e) { toast(e.detail || e.error || 'Generation failed', 'error'); }
  state.loading[`gen_${jobId}`] = false; render();
}

async function deleteJob(jobId) {
  if (!confirm('Delete this job?')) return;
  try {
    await api('DELETE', `/api/v1/jobs/${jobId}`);
    state.jobs = state.jobs.filter(j => j.id !== jobId);
    state.totalJobs = Math.max(0, state.totalJobs - 1);
    if (state.selectedJob?.id === jobId) {
      state.selectedJob = null;
      state.selectedJobDocs = null;
    }
    toast('Job deleted');
    render();
  } catch(e) { toast(e.detail || 'Delete failed', 'error'); }
}

function trackTask(taskId, label, onDone) {
  state.activeTasks[taskId] = { label, progress: 0, status: 'running' };
  render();
  const check = async () => {
    try {
      const t = await api('GET', `/api/v1/tasks/${taskId}`);
      const pct = Math.min(t.progress || 0, 100);
      state.activeTasks[taskId] = { label, progress: pct, status: t.status, message: t.progress_message || '' };
      render();
      if (t.status === 'completed') {
        delete state.activeTasks[taskId];
        toast(`${label} completed!`);
        onDone();
        return;
      }
      if (t.status === 'failed') {
        delete state.activeTasks[taskId];
        toast(`${label} failed: ${t.error_message || 'unknown'}`, 'error');
        render();
        return;
      }
      setTimeout(check, 3000);
    } catch { setTimeout(check, 5000); }
  };
  setTimeout(check, 2000);
}

// === Render ===
function scoreClass(s) { return s >= 70 ? 'score-high' : s >= 50 ? 'score-mid' : 'score-low'; }
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function tryParseJSON(s) { try { JSON.parse(s); return true; } catch { return false; } }

function renderActiveTaskBar() {
  const tasks = Object.entries(state.activeTasks);
  if (!tasks.length) return '';
  return tasks.map(([id, t]) => `
    <div style="padding:8px 24px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;font-size:13px">
      <div class="spinner" style="width:14px;height:14px;border-width:2px"></div>
      <span>${esc(t.label)}</span>
      <span style="color:var(--text2)">${t.message || t.status}</span>
      <div style="flex:1;max-width:200px">
        <div class="progress-bar"><div class="fill" style="width:${t.progress}%"></div></div>
      </div>
      <span style="color:var(--text2)">${t.progress}%</span>
    </div>
  `).join('');
}

function renderOnboarding() {
  const step = state.onboardingStep;
  const steps = [1,2,3];

  if (step === 1) {
    return `<div class="onboarding-page"><div class="onboarding-box">
      <div class="onboarding-steps">${steps.map(s => `<div class="onboarding-step ${s < step ? 'done' : s === step ? 'active' : ''}"></div>`).join('')}</div>
      <h2>Welcome! Let's set up your profile</h2>
      <p class="subtitle">Upload or paste your resume — we'll extract your skills, experience, and preferences automatically.</p>
      <div class="upload-zone" id="upload-zone">
        <div class="icon">&#128196;</div>
        <strong>Drop your resume here or click to upload</strong>
        <p>Supports PDF, DOCX, or TXT files</p>
        <input type="file" id="resume-file" accept=".pdf,.docx,.txt,.doc" style="display:none">
      </div>
      <div class="or-divider">or paste your resume text</div>
      <div class="form-group">
        <textarea id="resume-paste" rows="8" placeholder="Paste your full resume here — include education, experience, skills, projects...">${esc(state.resumeText)}</textarea>
      </div>
      <div class="onboarding-actions">
        <button class="btn btn-outline" onclick="skipOnboarding()">Skip for now</button>
        <button class="btn btn-primary" id="resume-next-btn">Next: Add API Key</button>
      </div>
    </div></div>`;
  }

  if (step === 2) {
    return `<div class="onboarding-page"><div class="onboarding-box">
      <div class="onboarding-steps">${steps.map(s => `<div class="onboarding-step ${s < step ? 'done' : s === step ? 'active' : ''}"></div>`).join('')}</div>
      <h2>Add your Gemini API Key</h2>
      <p class="subtitle">We use Google's Gemini AI to parse your resume and score jobs. Your key is encrypted and stored securely. <strong>It's free!</strong></p>

function setupOnboardingListeners() {
  const step = state.onboardingStep;

  if (step === 1) {
    const zone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('resume-file');
    const pasteArea = document.getElementById('resume-paste');
    const nextBtn = document.getElementById('resume-next-btn');

    zone?.addEventListener('click', () => fileInput?.click());
    zone?.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone?.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone?.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleResumeFile(e.dataTransfer.files[0]);
    });
    fileInput?.addEventListener('change', () => {
      if (fileInput.files.length) handleResumeFile(fileInput.files[0]);
    });

    nextBtn?.addEventListener('click', () => {
      const text = pasteArea?.value?.trim() || state.resumeText;
      if (!text || text.length < 50) { toast('Please paste or upload your resume (at least 50 characters)', 'error'); return; }
      state.resumeText = text;
      state.onboardingStep = 2;
      render();
    });
  }

  if (step === 2) {
    const parseBtn = document.getElementById('parse-resume-btn');
    const keyInput = document.getElementById('onboard-api-key');

    parseBtn?.addEventListener('click', async () => {
      const key = keyInput?.value?.trim();
      const errEl = document.getElementById('onboard-error');
      if (!key) { errEl.textContent = 'Please enter your Gemini API key'; return; }
      errEl.textContent = '';
      parseBtn.disabled = true;
      parseBtn.innerHTML = '<span class="spinner"></span> Parsing resume...';
      try {
        const result = await api('POST', '/api/v1/profile/parse-resume', {
          resume_text: state.resumeText,
          gemini_api_key: key
        });
        state.parsedProfile = result.parsed;
        state.user.has_api_key = true;
        state.profileText = state.resumeText;
        state.onboardingStep = 3;
        render();
      } catch(e) {
        errEl.textContent = e.detail || e.error || 'Failed to parse resume. Check your API key.';
        parseBtn.disabled = false;
        parseBtn.textContent = 'Parse My Resume';
      }
    });

    keyInput?.addEventListener('keypress', e => {
      if (e.key === 'Enter') parseBtn?.click();
    });
  }
}

async function handleResumeFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'txt') {
    state.resumeText = await file.text();
    const el = document.getElementById('resume-paste');
    if (el) el.value = state.resumeText;
    toast('Resume text loaded');
    return;
  }
  if (ext === 'pdf' || ext === 'docx' || ext === 'doc') {
    // Read as text — browsers can read basic text from these
    try {
      const text = await file.text();
      if (text.length > 100 && !text.includes('%PDF')) {
        state.resumeText = text;
        const el = document.getElementById('resume-paste');
        if (el) el.value = state.resumeText;
        toast('Resume loaded');
        return;
      }
    } catch {}
    toast('For PDF/DOCX: please copy-paste the text content instead', 'error');
    return;
  }
  toast('Unsupported file type. Please use TXT, PDF, or DOCX.', 'error');
}

function skipOnboarding() {
  state.onboarding = false;
  render();

function finishOnboarding() {
  state.onboarding = false;
  const p = state.parsedProfile;
  if (p) {
    if (p.target_roles) state.prefRoles = p.target_roles.join(', ');
    if (p.preferred_locations) state.prefLocations = p.preferred_locations.join(', ');
  }
  render();
  loadDashboard();
}

      </div>
      <div class="card">
        <h3>Account</h3>
        <div style="font-size:13px;color:var(--text2);line-height:2">
          <p><strong>Name:</strong> ${esc(u.name||'')}</p>
          <p><strong>Email:</strong> ${esc(u.email||'')}</p>
          <p><strong>Member since:</strong> ${esc(u.created_at||'')}</p>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Career Profile (Resume Vault)</h3>
      <p style="color:var(--text2);font-size:13px;margin-bottom:12px">Paste your full resume, skills, experience. This is used to score jobs and generate tailored documents.</p>
      <div class="form-group">
        <textarea id="profile-text" rows="10" placeholder="MS CS at MIT. 3 years backend experience. Python, Java, React, AWS, Docker, K8s. Built scalable APIs handling 1000 req/s...">${esc(state.profileText||'')}</textarea>
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveProfile()">Save Profile</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Preferences</h3>
      <div class="settings-grid">
        <div class="form-group">
          <label>Blacklisted Companies (comma-separated)</label>
          <input id="pref-blacklist" placeholder="TikTok, ByteDance" value="${esc(state.prefBlacklist||'')}">
        </div>
        <div class="form-group">
          <label>Target Roles (comma-separated)</label>
          <input id="pref-roles" placeholder="SDE, ML/AI, Fullstack" value="${esc(state.prefRoles||'')}">
        </div>
        <div class="form-group">
          <label>Minimum Score (0-100)</label>
          <input id="pref-min-score" type="number" min="0" max="100" value="${state.prefMinScore||30}">
        </div>
        <div class="form-group">
          <label>Preferred Locations</label>
          <input id="pref-locations" placeholder="SF, NYC, Remote" value="${esc(state.prefLocations||'')}">
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveSettings()" style="margin-top:12px">Save Settings</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Server</h3>
      <div class="form-group">
        <label>API Server URL</label>
        <input id="settings-api-url" value="${esc(API)}" style="font-size:12px">
      </div>
      <button class="btn btn-outline btn-sm" onclick="changeApiUrl()">Update Server URL</button>
    </div>`;
}

// === Actions ===
function setTab(t) {
  state.activeTab = t;
  if (t === 'jobs' && state.jobs.length === 0) loadDashboard();
  render();
}

function selectJob(id) {
  state.selectedJob = state.jobs.find(j => j.id === id) || null;
  state.selectedJobDocs = null;
  render();
  if (state.selectedJob) loadJobDocs(id);
}

async function saveApiKey() {
  const key = document.getElementById('api-key-input')?.value;
  if (!key) { toast('Enter an API key', 'error'); return; }
  try {
    await api('PUT', '/api/v1/profile/api-key', { gemini_api_key: key });
    toast('API key saved');
    await loadUser();
  } catch(e) { toast(e.detail || e.error || 'Failed', 'error'); }
}

async function deleteApiKey() {
  try {
    await api('DELETE', '/api/v1/profile/api-key');
    toast('API key removed');
    await loadUser();
  } catch(e) { toast(e.detail || e.error || 'Failed', 'error'); }
}

async function saveProfile() {
  const text = document.getElementById('profile-text')?.value || '';
  try {
    await api('PUT', '/api/v1/profile/', { profile_json: text });
    state.profileText = text;
    toast('Profile saved');
  } catch(e) { toast(e.detail || e.error || 'Failed', 'error'); }
}

async function saveSettings() {
  const bl = (document.getElementById('pref-blacklist')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const roles = (document.getElementById('pref-roles')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const minScore = parseInt(document.getElementById('pref-min-score')?.value||'30');
  const locs = (document.getElementById('pref-locations')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  try {
    await api('PUT', '/api/v1/profile/settings', {
      blacklist: bl, target_roles: roles, min_score: minScore, preferred_locations: locs
    });
    state.prefBlacklist = bl.join(', ');
    state.prefRoles = roles.join(', ');
    state.prefMinScore = minScore;
    state.prefLocations = locs.join(', ');
    toast('Settings saved');
  } catch(e) { toast(e.detail || e.error || 'Failed', 'error'); }
}

function changeApiUrl() {
  const url = document.getElementById('settings-api-url')?.value?.replace(/\/+$/, '');
  if (url) {
    localStorage.setItem('cp_api_url', url);
    location.reload();
  }
}

async function loadProfile() {
  try {
    const p = await api('GET', '/api/v1/profile/');
    state.profileText = p.profile_json || '';
    const s = p.settings || {};
    state.prefBlacklist = (s.blacklist||[]).join(', ');
    state.prefRoles = (s.target_roles||[]).join(', ');
    state.prefMinScore = s.min_score || 30;
    state.prefLocations = (s.preferred_locations||[]).join(', ');
  } catch {}
}

// === Render Engine ===
function render() {
  const app = document.getElementById('app');
  if (!state.token || !state.user) {
    app.innerHTML = renderAuth();
    setupAuthListeners();
  } else if (state.onboarding) {
    app.innerHTML = renderOnboarding();
    setupOnboardingListeners();
  } else {
    app.innerHTML = renderApp();
  }
}

function setupAuthListeners() {
  let isLogin = false;
  const toggle = () => {
    isLogin = !isLogin;
    const regFields = document.getElementById('register-fields');
    const submitBtn = document.getElementById('auth-submit');
    const toggleText = document.getElementById('auth-toggle-text');
    const toggleLink = document.getElementById('auth-toggle-link');
    if (isLogin) {
      regFields.classList.add('hidden');
      submitBtn.textContent = 'Sign In';
      toggleText.textContent = "Don't have an account?";
      toggleLink.textContent = 'Create one';
    } else {
      regFields.classList.remove('hidden');
      submitBtn.textContent = 'Create Account';
      toggleText.textContent = 'Already have an account?';
      toggleLink.textContent = 'Sign in';
    }
  };

  document.getElementById('auth-toggle-link')?.addEventListener('click', (e) => { e.preventDefault(); toggle(); });

  document.getElementById('auth-submit')?.addEventListener('click', async () => {
    const email = document.getElementById('auth-email')?.value;
    const pass = document.getElementById('auth-pass')?.value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    try {
      if (isLogin) {
        await login(email, pass);
      } else {
        const name = document.getElementById('reg-name')?.value;
        if (!name) { errEl.textContent = 'Name is required'; return; }
        await register(name, email, pass);
      }
      loadProfile();
    } catch(e) {
      errEl.textContent = e.detail || e.error || 'Authentication failed';
    }
  });

  ['auth-email','auth-pass','reg-name'].forEach(id => {
    document.getElementById(id)?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('auth-submit')?.click();
    });
  });

  document.getElementById('api-url-input')?.addEventListener('change', (e) => {
    const url = e.target.value.replace(/\/+$/, '');
    localStorage.setItem('cp_api_url', url);
    location.reload();
  });
}

// === Init ===
render();
if (state.token) {
  loadUser();
  loadProfile();
}
</script>
</body>
</html>
