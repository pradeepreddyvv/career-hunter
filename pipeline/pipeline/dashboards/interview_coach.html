<script>
(function(){
  const API = window.location.origin + '/webhook/task-hub-api';
  const EXPIRY_DAYS = 100;
  function saveAuth(pw) { localStorage.setItem('th_pw', JSON.stringify({ pw, expires: Date.now() + EXPIRY_DAYS * 86400000 })); }
  function getSavedAuth() {
    try { const d = JSON.parse(localStorage.getItem('th_pw')); if (!d || Date.now() > d.expires) { localStorage.removeItem('th_pw'); return null; } return d.pw; }
    catch { localStorage.removeItem('th_pw'); return null; }
  }
  window._doLogin = function() {
    const pw = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authErr');
    errEl.textContent = '';
    fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action:'auth',password:pw}) })
      .then(r => r.json()).then(d => {
        if (d.ok) { saveAuth(pw); document.getElementById('authOverlay').style.display='none'; document.getElementById('app').style.display=''; }
        else { errEl.textContent = 'Wrong password'; document.getElementById('authPassword').select(); }
      }).catch(() => { errEl.textContent = 'Connection error'; });
  };
  const saved = getSavedAuth();
  if (saved) {
    fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'auth',password:saved}) })
      .then(r=>r.json()).then(d=> {
        if(d.ok){ document.getElementById('authOverlay').style.display='none'; document.getElementById('app').style.display=''; }
        else { localStorage.removeItem('th_pw'); }
      }).catch(()=>{});
  }
})();
</script>

const IDATA_BASE = (location.origin.includes('localhost') ? location.origin : 'http://localhost:5678');
const IDATA_READ = IDATA_BASE + '/webhook/interview-data';
const IDATA_WRITE = IDATA_BASE + '/webhook/interview-data';
const PAGE_NAME = 'coach';

function idataToast(msg, ok) {
  const t = document.createElement('div');
  t.className = 'edit-toast';
  t.style.background = ok ? '#22c55e30' : '#ef444430';
  t.style.color = ok ? '#22c55e' : '#ef4444';
  t.style.border = '1px solid ' + (ok ? '#22c55e' : '#ef4444');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

async function idataLoad() {
  try {
    const r = await fetch(IDATA_READ + '?page=' + PAGE_NAME);
    const j = await r.json();
    return j.data || null;
  } catch(e) { console.warn('idataLoad failed:', e); return null; }
}

async function idataSave(key, data, index) {
  try {
    const body = {page: PAGE_NAME, key, data};
    if (typeof index === 'number') body.index = index;
    const r = await fetch(IDATA_WRITE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.success) idataToast('Saved!', true);
    else idataToast('Save failed', false);
    return j.success;
  } catch(e) { idataToast('Save error', false); return false; }
}

async function idataSeedIfEmpty(key, defaults) {
  try {
    const r = await fetch(IDATA_READ + '?page=' + PAGE_NAME);
    const j = await r.json();
    if (!j.data || !j.data[key]) {
      await fetch(IDATA_WRITE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({page:PAGE_NAME, key, data:defaults})});
    }
  } catch(e) {}
}

function openCoachEdit(title, fields, values) {
  return new Promise(resolve => {
    window._coachEditResolve = resolve;
    const ov = document.getElementById('coach-edit-overlay');
    let html = '<h3>' + title + '</h3>';
    fields.forEach(function(f) {
      const val = values[f.key] !== undefined ? values[f.key] : '';
      if (f.type === 'textarea') {
        html += '<div class="edit-field"><label>' + f.label + '</label><textarea id="cef_' + f.key + '" rows="' + (f.rows||3) + '">' + String(val).replace(/</g,'&lt;') + '</textarea></div>';
      } else if (f.type === 'array') {
        const arrVal = Array.isArray(val) ? val.join('\n') : String(val);
        html += '<div class="edit-field"><label>' + f.label + ' (one per line)</label><textarea id="cef_' + f.key + '" rows="' + (f.rows||3) + '">' + arrVal.replace(/</g,'&lt;') + '</textarea></div>';
      } else {
        html += '<div class="edit-field"><label>' + f.label + '</label><input type="text" id="cef_' + f.key + '" value="' + String(val).replace(/"/g,'&quot;') + '"></div>';
      }
    });
    html += '<div class="edit-actions"><button class="edit-cancel" onclick="closeCoachEdit(null)">Cancel</button><button class="edit-save" onclick="saveCoachEdit()">Save</button></div>';
    ov.querySelector('.edit-box').innerHTML = html;
    ov.classList.add('open');
  });
}

function closeCoachEdit(result) {
  document.getElementById('coach-edit-overlay').classList.remove('open');
  if (window._coachEditResolve) { window._coachEditResolve(result); window._coachEditResolve = null; }
}

function saveCoachEdit() {
  const inputs = document.querySelectorAll('#coach-edit-overlay [id^="cef_"]');
  const result = {};
  inputs.forEach(function(el) {
    const key = el.id.replace('cef_', '');
    if (el.closest('.edit-field') && el.closest('.edit-field').querySelector('label') && el.closest('.edit-field').querySelector('label').textContent.includes('one per line'))
      result[key] = el.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    else result[key] = el.value;
  });
  closeCoachEdit(result);
}

// Load data from store on startup
async function loadCoachData() {
  const data = await idataLoad();
  if (data) {
    if (data.AMAZON_LP_QUESTIONS) AMAZON_LP_QUESTIONS = data.AMAZON_LP_QUESTIONS;
    if (data.DEFAULT_QTA) DEFAULT_QTA = data.DEFAULT_QTA;
  } else {
    idataSeedIfEmpty('AMAZON_LP_QUESTIONS', AMAZON_LP_QUESTIONS);
    idataSeedIfEmpty('DEFAULT_QTA', DEFAULT_QTA);
  }
}

// ═══════════════════════════════════════════════════
// GEMINI API (direct from browser)
// ═══════════════════════════════════════════════════
async function callGemini(prompt, temp = 0.7) {
  const res = await fetch(`${GEMINI_URL}?key=${GEMINI_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: temp, maxOutputTokens: 4096 },
    }),
  });
  if (!res.ok) throw new Error(`Gemini error ${res.status}`);
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

function extractJson(text) {
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  const str = fence ? fence[1].trim() : text.trim();
  return JSON.parse(str.replace(/,\s*([}\]])/g, '$1'));
}

  "dimension_scores": { "clarity": <0-100>, "confidence": <0-100>, "conciseness": <0-100>, "storytelling": <0-100>, "technical_depth": <0-100> },
  "lp_alignment": <0-100>,
  "strengths": ["strength1", "strength2", "strength3"],
  "improvements": ["improvement1", "improvement2", "improvement3"],
  "delivery_analysis": { "filler_words": [], "hedging_phrases": [], "power_words": [], "pacing": "too_short|good|too_long" },
  "weak_areas": [],
  "coaching_tip": "One specific, actionable tip",
  "ideal_structure": "Brief outline of ideal answer",
  "follow_up_question": "A natural follow-up",
  "recommendation": "Strong|Good|Needs Work|Redo"
}

SCORING GUIDELINES:
- 85-100: Exceptional — clear STAR, specific metrics, strong LP alignment
- 70-84: Good — solid structure but missing some specifics
- 55-69: Okay — has a story but vague on actions or results
- 40-54: Weak — missing key STAR components
- 0-39: Poor — off-topic, no structure

DIMENSION SCORING RULES:
- "conciseness": VAGUE answers with no specifics should score LOW (vague != concise).
- "confidence": Hedging ("I think", "kind of") = low. Direct statements = high.
- "coaching_tip": If 85+, give ADVANCED tip. If below 60, focus on biggest gap.
- "weak_areas": If 85+, return empty array [].
- "improvements": For 85+, frame as "next level" suggestions.

RESULT SCORING (STRICT):
- 85-100: Must have SPECIFIC metrics (percentages, dollar amounts, time saved). "Improved performance" without numbers = NOT 85+.
- 70-84: Has some quantification or clear measurable outcome.
- 50-69: States an outcome but no numbers ("it worked", "things went back to normal").
- 0-49: No clear result stated.

IMPORTANT: Focus on ACTION specificity (what THEY did, not "we") and RESULT quantification.
For pacing: too_short = under 60s, good = 60-180s, too_long = over 180s.`;
}

function buildSessionPrompt(answers) {
  const summary = answers.map((a, i) =>
    `Q${i+1} [${a.questionLp}]: "${a.questionText}"\nAnswer (score: ${a.feedback?.overall_score || '?'}): "${a.answerText.substring(0, 200)}..."\nWeak areas: ${a.feedback?.weak_areas?.join(', ') || 'none'}`
  ).join('\n\n');
  return `You are an [Target] interviewer completing a mock interview debrief. Analyze this full session.

SESSION (${answers.length} questions):
${summary}

IMPORTANT: For communication_habits, evaluate ACROSS ALL answers. If even one answer uses specific metrics, set "uses_metrics" to true.

Return ONLY valid JSON:
{
  "session_score": <0-100>,
  "readiness_rating": <1-10>,
  "readiness_label": "Ready|Almost Ready|Needs More Practice|Not Ready",
  "per_question_summary": [{"question_num": 1, "lp": "...", "score": 0, "one_liner": "..."}],
  "recurring_strengths": [],
  "recurring_weaknesses": [],
  "communication_habits": { "filler_tendency": "none|occasional|frequent", "uses_metrics": true, "says_I_vs_we": "mostly_I|mixed|mostly_we", "star_structure": "strong|inconsistent|weak" },
  "top_3_priorities": [{"area": "...", "drill": "..."}],
  "hiring_recommendation": "Strong Hire|Hire|Lean Hire|Lean No Hire|No Hire",
  "encouragement": "..."
}`;
}

function buildFollowUpPrompt(question, answer, lp, feedback) {
  return `You are an [Target] interviewer. Generate ONE natural follow-up question.
Original question [${lp}]: "${question}"
Candidate's answer: "${answer}"
Weak areas: ${feedback?.weak_areas?.join(', ') || 'none'}
Return ONLY valid JSON: {"followup_question": "...", "reason": "..."}`;
}

// SPEECHMATICS via n8n proxy

async function getSpeechmaticsKey() {
  const res = await fetch(N8N_API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'get_key' }),
  });
  if (!res.ok) throw new Error('Failed to get Speechmatics key');
  const data = await res.json();
  return data.key;
}

async function getTTS(text) {
  const res = await fetch(N8N_API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'tts', text }),
  });
  if (!res.ok) throw new Error('TTS failed');
  // Returns base64 audio chunks
  return await res.json();
}

function lsSet(key, val) { localStorage.setItem('ic_' + key, JSON.stringify(val)); }

      const playNext = () => {
        if (ttsQueueRef.current.length === 0 || !ttsPlayingRef.current) {
          setIsSpeaking(false);
          ttsPlayingRef.current = false;
          ttsAudioRef.current = null;
          onEnd?.();
          return;
        }
        const chunk = ttsQueueRef.current.shift();
        const bytes = atob(chunk.audio);
        const arr = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        const blob = new Blob([arr], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        ttsAudioRef.current = audio;
        audio.onended = () => { URL.revokeObjectURL(url); playNext(); };

      React.createElement('text', { x:size/2, y:size/2+8, textAnchor:'middle', fill:color, fontSize:size*0.3, fontWeight:700, className:'rotate-90', style:{transformOrigin:`${size/2}px ${size/2}px`} }, score)

        h('div', { key:s.label, className:'p-4 rounded-2xl border border-white/10 bg-white/[0.02] text-center' },
          h('p', { className:'text-2xl mb-1' }, s.icon),
          h('p', { className:'text-2xl font-bold' }, s.value),
          h('p', { className:'text-xs text-gray-500' }, s.label)
        )
      )
    ),
    stats.totalSessions === 0 && h('div', { className:'text-center py-12 text-gray-500' },
      h('p', { className:'text-4xl mb-3' }, '\u{1F4CA}'),
      h('p', null, 'Complete a session to see your progress')
    )
  );

  // ── HISTORY ──
  const fmtDate = (d) => { try { const dt = new Date(d); return isNaN(dt.getTime()) ? 'Unknown date' : dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString(); } catch { return 'Unknown date'; } };
  const deleteSession = (sid) => {
    const all = lsGet('sessions', []).filter(s => s.id !== sid);
    lsSet('sessions', all);
    setPastSessions(all);
    setSelectedSession(null);
  };
  const clearBrokenSessions = () => {
    const all = lsGet('sessions', []).filter(s => s.startedAt && !isNaN(new Date(s.startedAt).getTime()) && (s.answers||[]).length > 0);
    lsSet('sessions', all);
    setPastSessions(all);
  };
  const historyView = mode === 'history' && h('div', { className:'max-w-3xl mx-auto py-8 px-6' },
    h('div', { className:'flex items-center justify-between mb-6' },
      h('h2', { className:'text-xl font-bold' }, 'Session History'),
      pastSessions.length > 0 && h('button', { onClick:clearBrokenSessions, className:'text-xs text-gray-500 hover:text-red-400 transition' }, 'Clean up empty sessions')
    ),
    !selectedSession && h('div', { className:'space-y-3' },
      pastSessions.length === 0 && h('div', { className:'text-center py-12 text-gray-500' }, h('p', { className:'text-4xl mb-3' }, '\u{1F4C1}'), h('p', null, 'No sessions yet. Start practicing!')),
      pastSessions.map(s =>
        h('button', { key:s.id, onClick:() => setSelectedSession(s), className:'w-full p-4 rounded-2xl border border-white/10 bg-white/[0.02] hover:bg-white/[0.04] transition text-left flex items-center gap-4' },
          h('div', { className:`text-2xl font-bold ${scoreColor(s.avgScore || 0)}` }, Math.round(s.avgScore || 0)),
          h('div', { className:'flex-1' },
            h('p', { className:'text-sm font-medium' }, `${(s.answers||[]).length} questions`),
            h('p', { className:'text-xs text-gray-500' }, fmtDate(s.startedAt))
          ),
          s.completedAt ? h('span', { className:'text-xs px-2 py-1 rounded bg-emerald-500/20 text-emerald-300' }, 'Completed') :
            (s.answers||[]).length === 0 ? h('span', { className:'text-xs px-2 py-1 rounded bg-red-500/20 text-red-300' }, 'Empty') :
            h('span', { className:'text-xs px-2 py-1 rounded bg-yellow-500/20 text-yellow-300' }, 'In Progress'),
          h('span', { className:'text-gray-500' }, '\u2192')
        )
      )
    ),
    selectedSession && h('div', null,
      h('div', { className:'flex items-center justify-between mb-4' },
        h('button', { onClick:() => setSelectedSession(null), className:'text-sm text-gray-400 hover:text-white flex items-center gap-1' }, '\u2190 Back to list'),
        h('button', { onClick:() => { if (confirm('Delete this session?')) deleteSession(selectedSession.id); }, className:'text-xs text-red-400 hover:text-red-300 px-2 py-1 rounded border border-red-500/20 hover:bg-red-500/10 transition' }, 'Delete Session')
      ),
      h('div', { className:'p-4 rounded-2xl border border-white/10 bg-white/[0.02] mb-4' },
        h('div', { className:'flex items-center justify-between' },
          h('div', null,
            h('p', { className:'font-medium' }, 'Session ' + selectedSession.id.slice(-8)),
            h('p', { className:'text-xs text-gray-500' }, fmtDate(selectedSession.startedAt))
          ),
          h('div', { className:`text-3xl font-bold ${scoreColor(selectedSession.avgScore || 0)}` }, Math.round(selectedSession.avgScore || 0))
        )
      ),
      (selectedSession.answers || []).length === 0
        ? h('div', { className:'text-center py-12 text-gray-500' },
            h('p', { className:'text-4xl mb-3' }, '\u{1F4AD}'),
            h('p', null, 'No answers recorded in this session.'),
            h('p', { className:'text-xs mt-2' }, 'This session was started but never completed.')
          )
        : h('div', { className:'space-y-3' },
            (selectedSession.answers || []).map(a =>
              h('div', { key:a.id, className:'p-4 rounded-2xl border border-white/10 bg-white/[0.02]' },
                h('div', { className:'flex items-center gap-3 mb-2' },
                  h('span', { className:`text-lg font-bold ${scoreColor(a.feedback?.overall_score || 0)}` }, a.feedback?.overall_score || '?'),
                  h('span', { className:'text-xs px-2 py-0.5 rounded bg-orange-500/15 text-orange-300' }, a.questionLp)
                ),
                h('p', { className:'text-sm font-medium mb-1' }, a.questionText),
                h('p', { className:'text-xs text-gray-500 line-clamp-2' }, a.answerText),
                a.feedback && h('div', { className:'mt-2 pt-2 border-t border-white/5 flex gap-4 text-xs' },
                  h('span', null, 'S:' + a.feedback.star_scores?.situation),
                  h('span', null, 'T:' + a.feedback.star_scores?.task),
                  h('span', null, 'A:' + a.feedback.star_scores?.action),
                  h('span', null, 'R:' + a.feedback.star_scores?.result),
                  h('span', { className:'ml-auto' }, a.feedback.recommendation)
                )
              )
            )
          )
    )
  );

  // ── QUESTIONS TO ASK ──
  const askView = mode === 'ask' && h('div', { className:'max-w-3xl mx-auto py-8 px-6' },
    h('div', { className:'flex items-center justify-between mb-6' },
      h('div', null,
        h('h2', { className:'text-xl font-bold' }, 'Questions to Ask the Interviewer'),
        h('p', { className:'text-xs text-gray-500 mt-1' }, 'Prepare thoughtful questions for the end of each round.')
      ),
      h('button', { onClick:() => { setAddingQta(true); setQtaForm({ text:'', category:'general', notes:'' }); }, className:'px-4 py-2 bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 rounded-xl text-sm hover:bg-cyan-500/30 transition' }, '+ Add Question')
    ),
    addingQta && h('div', { className:'p-5 rounded-2xl border border-cyan-500/20 bg-cyan-500/5 mb-6 space-y-3 slide-up' },
      h('input', { value:qtaForm.text, onChange:e => setQtaForm({...qtaForm, text:e.target.value}), className:'w-full p-3 rounded-xl bg-white/5 border border-white/10 text-sm focus:outline-none focus:border-cyan-500/50', placeholder:'Type your question...' }),
      h('div', { className:'flex gap-3' },
        h('select', { value:qtaForm.category, onChange:e => setQtaForm({...qtaForm, category:e.target.value}), className:'bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-sm' },
          ['team','technical','culture','intern','general'].map(c => h('option', { key:c, value:c }, c === 'team' ? 'Team & Role' : c === 'technical' ? 'Technical' : c === 'culture' ? 'Culture' : c === 'intern' ? 'Intern-Specific' : 'General'))
        ),
        h('input', { value:qtaForm.notes, onChange:e => setQtaForm({...qtaForm, notes:e.target.value}), className:'flex-1 p-2 rounded-lg bg-white/5 border border-white/10 text-xs focus:outline-none focus:border-cyan-500/50', placeholder:'Why ask this?' })
      ),
      h('div', { className:'flex gap-2' },
        h('button', { onClick:() => {
          if (!qtaForm.text.trim()) return;
          const updated = [...questionsToAsk, { id: 'qta_' + Date.now(), text: qtaForm.text, category: qtaForm.category, notes: qtaForm.notes }];
          setQuestionsToAsk(updated); lsSet('questionsToAsk', updated); setAddingQta(false);
        }, className:'px-4 py-1.5 bg-cyan-500/30 text-cyan-200 rounded-lg text-sm hover:bg-cyan-500/40' }, 'Save'),
        h('button', { onClick:() => setAddingQta(false), className:'px-4 py-1.5 text-gray-500 hover:text-white text-sm' }, 'Cancel')
      )
    ),
    ['team','technical','culture','intern','general'].map(cat => {
      const catQs = questionsToAsk.filter(q => q.category === cat);
      if (catQs.length === 0) return null;
      const label = cat === 'team' ? 'Team & Role' : cat === 'technical' ? 'Technical' : cat === 'culture' ? 'Culture' : cat === 'intern' ? 'Intern-Specific' : 'General';
      const color = cat === 'team' ? 'text-cyan-400' : cat === 'technical' ? 'text-violet-400' : cat === 'culture' ? 'text-orange-400' : cat === 'intern' ? 'text-emerald-400' : 'text-gray-400';
      return h('div', { key:cat, className:'mb-6' },
        h('h3', { className:`text-xs uppercase tracking-wider mb-3 ${color}` }, label),
        h('div', { className:'space-y-2' },
          catQs.map(q => {
            const qtaIdx = DEFAULT_QTA.findIndex(d => d.id === q.id);
            return h('div', { key:q.id, className:'q-item p-4 rounded-2xl border border-white/10 bg-white/[0.02] group', style:{position:'relative'} },
              qtaIdx >= 0 && h('button', { className:'edit-icon', onClick:function(e) { e.stopPropagation(); editQTA(qtaIdx); }, title:'Edit' }, '\u270E'),
              h('div', { className:'flex items-start justify-between gap-3' },
                h('p', { className:'text-sm text-gray-200 leading-relaxed' }, q.text),
                h('div', { className:'flex gap-1 opacity-0 group-hover:opacity-100 transition shrink-0' },
                  h('button', { onClick:() => {
                    const updated = questionsToAsk.filter(x => x.id !== q.id);
                    setQuestionsToAsk(updated); lsSet('questionsToAsk', updated);
                  }, className:'text-[10px] px-2 py-1 text-gray-500 hover:text-red-400 rounded hover:bg-white/5' }, 'Delete')
                )
              ),
              q.notes && h('p', { className:'text-xs text-gray-500 mt-2 pl-3 border-l-2 border-white/10 italic' }, q.notes)
            );
          })
        )
      );
    }),
    // LP Questions (editable)
    h('div', { className:'mt-10 mb-6' },
      h('h3', { className:'text-xs uppercase tracking-wider mb-3 text-violet-400' }, 'Leadership Principle Questions (' + AMAZON_LP_QUESTIONS.length + ')'),
      h('div', { className:'space-y-2' },
        AMAZON_LP_QUESTIONS.map((q, idx) =>
          h('div', { key:q.id || idx, className:'q-item p-4 rounded-2xl border border-white/10 bg-white/[0.02] group', style:{position:'relative'} },
            h('button', { className:'edit-icon', onClick:function(e) { e.stopPropagation(); editLPQuestion(idx); }, title:'Edit' }, '\u270E'),
            h('div', { className:'flex items-start gap-3' },
              h('span', { className:'text-xs px-2 py-0.5 rounded bg-orange-500/15 text-orange-300 shrink-0 mt-0.5' }, q.lp),
              h('p', { className:'text-sm text-gray-200 leading-relaxed' }, q.text)
            ),
            q.hint && h('p', { className:'text-xs text-gray-500 mt-2 pl-3 border-l-2 border-white/10 italic' }, q.hint)
          )
        )
      )
    ),
    // Tips
    h('div', { className:'mt-8 p-5 rounded-2xl border border-white/10 bg-white/[0.02]' },
      h('h3', { className:'text-xs text-gray-500 uppercase tracking-wider mb-3' }, 'Tips for Asking Questions'),
      h('ul', { className:'space-y-2 text-xs text-gray-400' },
        ['Pick 2-3 questions per round. Don\'t read from a list.', 'Tailor to the interviewer\'s role.', 'Avoid questions easily answered by the job posting.', 'Show you\'ve researched the company.', 'The questions you ask signal what you care about.'].map((t,i) => h('li', { key:i }, '- ' + t))
      )
    )
  );

  return h('div', { className:'min-h-screen flex flex-col' },
    header,
    h('main', { className:'flex-1 overflow-y-auto' },
      homeView,
      interviewView,
      summaryView,
      progressView,
      historyView,
      askView
    )
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(React.createElement(App));
</script>
<div class="edit-overlay" id="coach-edit-overlay"><div class="edit-box"></div></div>
</body>
</html>
