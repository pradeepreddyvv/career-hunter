[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-pipeline"
version = "1.0.0"
description = "AI-powered job discovery, scoring, and application document generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Career Pipeline Contributors"},
]
keywords = ["career", "jobs", "resume", "ai", "gemini", "ats"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.10.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "beautifulsoup4>=4.12.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
career-pipeline = "pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/career-pipeline/career-pipeline"
Documentation = "https://github.com/career-pipeline/career-pipeline#readme"
Issues = "https://github.com/career-pipeline/career-pipeline/issues"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
